name: Publish Provider Package

# Publishing is deliberate: it only ever runs on manual dispatch, never from
# CI. Credentials follow the same wiring as the Upbound configuration packages
# in sa-up/gitops/configs -- an Upbound API token (UP_API_TOKEN) plus an
# organization (UP_ORG), consumed by upbound/action-up, which installs the `up`
# CLI and logs it in. `make xpkg.push.up` then pushes with `up xpkg push`,
# which reads that profile.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1). Defaults to the version derived from git."
        default: ''
        required: false

env:
  # We can't run a step 'if secrets.XXX != ""' but we can run a step
  # 'if env.XXX != ""', so copy these to succinctly test whether credentials
  # have been provided before trying to run steps that need them.
  UP_API_TOKEN: ${{ secrets.UP_API_TOKEN }}
  UP_ORG: ${{ secrets.UP_ORG }}
  UP_ROBOT_ID: ${{ secrets.UP_ROBOT_ID }}
  XPKG_REGISTRY: xpkg.upbound.io
  DOCKER_BUILDX_VERSION: 'v0.23.0'

jobs:
  publish-provider-package:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      # The build submodule derives VERSION from `git describe`, which needs
      # the full history and all tags.
      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install and login with up
        if: env.UP_API_TOKEN != '' && env.UP_ORG != ''
        uses: upbound/action-up@53fe6395637d884c80d2bbc8c2d75d0ece776ced # v1
        with:
          api-token: ${{ secrets.UP_API_TOKEN }}
          organization: ${{ secrets.UP_ORG }}

      # The up login above is NOT sufficient to push. UP_API_TOKEN is a robot
      # token, and up's RegistryKeychain explicitly falls back to the Docker
      # keychain for robot tokens ("robot tokens cannot be used for registry
      # login 401 Unauthorized"), so the push credentials must come from a
      # docker login. The robot id is the username. This mirrors the shared
      # configuration CI template in sa-up/gitops/shared-files.
      - name: Login to xpkg with robot
        if: env.UP_API_TOKEN != '' && env.UP_ROBOT_ID != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.XPKG_REGISTRY }}
          username: ${{ env.UP_ROBOT_ID }}
          password: ${{ env.UP_API_TOKEN }}

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # An empty `VERSION=` on the command line would override the version the
      # build submodule derives from git with the empty string, so only pass it
      # through when the dispatch input was actually filled in.
      - name: Resolve Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "make_args=VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "make_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Artifacts
        run: make -j2 build.all ${{ steps.version.outputs.make_args }}
        env:
          # We're using docker buildx, which doesn't actually load the images it
          # builds by default. Specifying --load does so.
          BUILD_ARGS: "--load"

      - name: Publish Artifacts to GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: _output/**

      - name: Push Package to xpkg.upbound.io
        if: env.UP_API_TOKEN != '' && env.UP_ORG != ''
        run: make xpkg.push.up ${{ steps.version.outputs.make_args }}
