# Supply Chain Security Workflow Template
#
# Based on provider-anthropic's supply chain workflow (factored out of the
# official Crossplane provider release process by @haarchri and @jonasz-lasut),
# extended with govulncheck reachability analysis, vens contextual risk scoring,
# and OpenVEX declarations.
#
# Convention: 0104 — Supply Chain Security Artifacts
#
# Usage: Copy to provider-<name>/.github/workflows/supplychain.yaml and
# update the env block with provider-specific values.

name: Supply Chain and Xpkg Extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. v1.0.0-rc1)"
        required: true

permissions:
  contents: write          # create releases, attach assets
  id-token: write          # keyless cosign via Sigstore OIDC
  packages: write          # push to GHCR, attach OCI artifacts
  attestations: write      # SLSA provenance attestation
  security-events: write   # upload SARIF (optional)

env:
  # ── Provider-specific (UPDATE THESE) ──────────────────────────────
  PROVIDER_NAME: provider-infobloxnios
  GHCR_IMAGE: ghcr.io/kaessert/provider-infobloxnios
  MIRROR_IMAGE: xpkg.upbound.io/kaessert/provider-infobloxnios
  # ── Tooling versions ──────────────────────────────────────────────
  UP_VERSION: v0.51.1
  GO_VERSION: "1.25"

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Gate: security checks must pass before any signing/attestation
  # ════════════════════════════════════════════════════════════════════
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          go install github.com/venslabs/vens/cmd/vens@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # Gate 1: Zero reachable CVEs (symbol-level)
      - name: "Gate: govulncheck (reachable CVEs)"
        run: govulncheck ./...

      # Gate 2: Zero fixable module-level CVEs
      - name: "Gate: grype (module-level CVEs)"
        run: |
          grype db update -q
          grype dir:. --fail-on low --only-fixed -q

      # Gate 3: No GPL-family licenses in dependency tree
      - name: "Gate: license compliance"
        run: |
          cyclonedx-gomod mod -json -licenses -output /tmp/sbom-licenses.json
          if jq -r '.components[]?.licenses[]?.license?.id // empty' /tmp/sbom-licenses.json | grep -iE '^(GPL|AGPL|LGPL)'; then
            echo "::error::GPL-family license detected in dependency tree"
            exit 1
          fi
          echo "License check passed — no GPL-family licenses found"

      # Generate Go module SBOM (CycloneDX)
      - name: Generate CycloneDX SBOM
        run: cyclonedx-gomod mod -json -licenses -output sbom.cdx.json

      # Generate OpenVEX (reachability declarations)
      - name: Generate OpenVEX
        run: govulncheck -format openvex ./... > vex.openvex.json 2>/dev/null || true

      # Generate contextual risk scores (vens)
      - name: Generate risk-scored VEX
        if: hashFiles('security/vens-config.yaml') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Container scan for vens input
          RESOLVED_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Use grype JSON as input (vens supports trivy and grype formats)
          grype dir:. -o json --file grype-report.json -q || true
          SBOM_SERIAL="urn:uuid:$(cat /proc/sys/kernel/random/uuid)"
          vens generate \
            --config-file security/vens-config.yaml \
            --sbom-serial-number "$SBOM_SERIAL" \
            --input-format grype \
            grype-report.json \
            risk-scored.vex.json || echo "::warning::vens risk scoring failed (non-blocking)"

      - name: Upload security artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-artifacts
          path: |
            sbom.cdx.json
            vex.openvex.json
            risk-scored.vex.json

  # ════════════════════════════════════════════════════════════════════
  # Sign and attest: image signing, SBOM/VEX attestation, Marketplace
  # ════════════════════════════════════════════════════════════════════
  sign-and-attest:
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        id: syft-install

      - name: Download security artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: security-artifacts

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # ── GHCR: sign + attest ──────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign GHCR Image
        run: cosign sign --yes ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Generate GHCR SBOM (SPDX — container level)
        run: ${{ steps.syft-install.outputs.cmd }} ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }} -o spdx-json=ghcr-sbom.spdx.json

      - name: Attest SBOM to GHCR Image (SPDX)
        run: cosign attest --yes --predicate ghcr-sbom.spdx.json --type spdxjson ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Attest SBOM to GHCR Image (CycloneDX)
        run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Attest VEX to GHCR Image
        if: hashFiles('vex.openvex.json') != ''
        run: cosign attest --yes --predicate vex.openvex.json --type openvex ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Resolve GHCR Image Digest
        id: ghcr-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }} | awk '/^Digest:/{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA Provenance to GHCR Image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.ghcr-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # ── Upbound Marketplace: sign + attest + extensions ──────────
      - name: Login to Upbound Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Up Login
        env:
          UP_TOKEN: ${{ secrets.UP_TOKEN }}
        run: |
          curl -fsSLo /tmp/up --create-dirs 'https://cli.upbound.io/stable/${{ env.UP_VERSION }}/bin/linux_amd64/up'
          chmod +x /tmp/up
          /tmp/up login

      - name: Generate Upbound Mirror SBOM (SPDX)
        run: ${{ steps.syft-install.outputs.cmd }} ${{ env.MIRROR_IMAGE }}:${{ steps.version.outputs.tag }} -o spdx-json=mirror-sbom.spdx.json

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BODY=$(gh release view ${{ steps.version.outputs.tag }} --json body -q .body 2>/dev/null || true)
          if [ -n "$RELEASE_BODY" ]; then
            echo "$RELEASE_BODY" >> "release_notes.md"
          fi

      - name: Append package assets for Marketplace
        run: |
          extensions_dir=${{ github.workspace }}/extensions
          mkdir -p $extensions_dir/sbom
          cp ./mirror-sbom.spdx.json $extensions_dir/sbom/sbom.spdx.json
          mkdir -p $extensions_dir/readme
          cp ./README.md $extensions_dir/readme/readme.md
          mkdir -p $extensions_dir/release-notes
          if [ -f ./release_notes.md ]; then
            cp ./release_notes.md $extensions_dir/release-notes/
          fi
          /tmp/up alpha xpkg append ${{ env.MIRROR_IMAGE }}:${{ steps.version.outputs.tag }} --extensions-root $extensions_dir

      - name: Sign Upbound Mirror Image
        run: cosign sign --yes ${{ env.MIRROR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Attest SBOM to Upbound Mirror Image
        run: cosign attest --yes --predicate mirror-sbom.spdx.json --type spdxjson ${{ env.MIRROR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Resolve Upbound Mirror Image Digest
        id: mirror-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ env.MIRROR_IMAGE }}:${{ steps.version.outputs.tag }} | awk '/^Digest:/{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA Provenance to Upbound Mirror Image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.MIRROR_IMAGE }}
          subject-digest: ${{ steps.mirror-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # ── Attach to GitHub Release ─────────────────────────────────
      - name: Attach security artifacts to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.3.2
        with:
          files: |
            sbom.cdx.json
            ghcr-sbom.spdx.json
            vex.openvex.json
            risk-scored.vex.json
