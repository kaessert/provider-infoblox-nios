# DNSView is the namespace-scoped variant of the Infoblox NIOS DNS view.
# See dns-view.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the view name below differs from dns-view.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same DNS view name.
#
# ${data.runToken}: see dns-view.yaml — same per-run isolation token,
# applied here too so this scope's identity ALSO differs across
# concurrent E2E runs, not just from its cluster-scoped sibling.
apiVersion: dnsview.infobloxnios.m.crossplane.io/v1alpha1
kind: DNSView
metadata:
  name: example-dnsview-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: dnsview/v1alpha1/dnsview
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # dns-view.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dns-view-namespaced.sh
    # See dns-view.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: disable
        value: true
      - field: notifyDelay
        value: 10
      - field: useBlacklist
        value: true
      - field: blacklistAction
        value: "REFUSE"
      - field: useDdnsForceCreationTimestampUpdate
        value: true
      - field: ddnsForceCreationTimestampUpdate
        value: true
      - field: useDdnsPrincipalSecurity
        value: true
      - field: ddnsRestrictSecure
        value: true
      - field: useDns64
        value: true
      - field: useDnssec
        value: true
      - field: dnssecEnabled
        value: true
      - field: useFixedRrsetOrderFqdns
        value: true
      - field: enableFixedRrsetOrderFqdns
        value: true
      - field: enableMatchRecursiveOnly
        value: true
      - field: useLameTtl
        value: true
      - field: lameTtl
        value: 60
      - field: useMaxCacheTtl
        value: true
      - field: maxCacheTtl
        value: 3600
      - field: useRecursion
        value: true
      - field: recursion
        value: true
      - field: useSortlist
        value: true
      - field: name
        skip: "renaming rotates the WAPI _ref (DNSView is in the _ref-unstable resource group); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: networkView
        skip: "structural reassociation requiring a second NetworkView object not created by this standalone example"
      - field: ddnsPrincipalGroup
        skip: "references a pre-existing Grid DDNS principal cluster group not modeled by this standalone example"
      - field: filterAaaa
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: rootNameServerType
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: forwardOnly
        skip: "requires the forwarders list (skipped below) to be non-empty per WAPI business rules"
      - field: nxdomainRedirect
        skip: "requires nxdomainRedirectAddresses (skipped below) to be non-empty per WAPI business rules"
      - field: enableBlacklist
        skip: "requires blacklistRulesets (skipped below, a reference to a pre-existing Grid Ruleset object) to be non-empty per WAPI business rules, and additionally blacklistRedirectAddresses (also skipped below) when blacklistAction is REDIRECT; blacklistAction remains update-tested since it is settable while the blacklist itself is disabled"
      - field: dns64Enabled
        skip: "requires the dns64Groups list (skipped below) to be non-empty per WAPI business rules (\"DNS64 cannot be enabled unless at least one synthesis group is configured\"); the useDns64 override flag is still exercised"
      - field: blacklistLogQuery
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment for the full explanation and the representative field list that stays tested); this group's Update() path is already evidenced via blacklistAction above"
      - field: blacklistRedirectTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via blacklistAction above"
      - field: ddnsPrincipalTracking
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via useDdnsPrincipalSecurity above"
      - field: useDdnsPatternsRestriction
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictPatterns
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: useDdnsRestrictProtected
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictProtected
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: useDdnsRestrictStatic
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictStatic
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: dnssecExpiredSignaturesEnabled
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via dnssecEnabled above"
      - field: dnssecValidationEnabled
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via dnssecEnabled above"
      - field: useFilterAaaa
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); not independently represented in the reduced tested set"
      - field: useForwarders
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); not independently represented in the reduced tested set"
      - field: useMaxNcacheTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via useMaxCacheTtl/maxCacheTtl above"
      - field: maxNcacheTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); this group's Update() path is already evidenced via useMaxCacheTtl/maxCacheTtl above"
      - field: useNxdomainRedirect
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see dns-view.yaml's header comment); not independently represented in the reduced tested set"
