# DNSView is the namespace-scoped variant of the Infoblox NIOS DNS view.
# See dns-view.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the view name below differs from dns-view.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same DNS view name.
apiVersion: dnsview.infobloxnios.m.crossplane.io/v1alpha1
kind: DNSView
metadata:
  name: example-dnsview-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: dnsview/v1alpha1/dnsview
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # dns-view.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dns-view-namespaced.sh
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
spec:
  forProvider:
    name: crossplane-test-view-ns
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
