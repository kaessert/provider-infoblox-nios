# DNSView is a cluster-scoped Infoblox NIOS DNS view (WAPI object type
# view). See dns-view-namespaced.yaml for the namespace-scoped variant used
# by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI POST returns an opaque `_ref` string
# (e.g. "view/ZG5zLnZpZXckY3Jvc3NwbGFuZS10ZXN0LXZpZXcvZmFsc2U:crossplane-test-view/false")
# from Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it. Create is synchronous — WAPI's POST returns the `_ref`
# immediately (200/201), so the default uptest timeout is sufficient.
#
# Well-known-default pattern: the NIOS Grid Manager always ships three
# pre-existing views ("default", "External", "Internal"). This example
# creates a distinct custom view instead of trying to re-create one of
# those, so it never collides with a fresh Grid Manager's built-in views.
#
# Required fields:
#   name: name of the DNS view. Renaming an existing view changes its
#         `_ref` — the controller re-reads `_ref` from the PUT response
#         and updates the external-name annotation.
#
# Optional mutable fields: comment, networkView, disable, and many more
# advanced DNS-tuning fields (blacklist, DDNS, DNS64, filtering, etc. — see
# the DNSView CRD schema for the full list). `isDefault` is a response-only
# field (WAPI supports=sr) and is never set here.
apiVersion: dnsview.infobloxnios.crossplane.io/v1alpha1
kind: DNSView
metadata:
  name: example-dnsview
  annotations:
    meta.upbound.io/example-id: dnsview/v1alpha1/dnsview
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dns-view.sh
    # DNSView has ~70 mutable fields, most gated by a paired "use" flag
    # (the pattern documented on record TTL fields elsewhere in this
    # catalog — see record-cname.yaml — generalized across the whole
    # resource). This annotation tests: comment, disable, notifyDelay, and
    # every independent boolean flag and its paired scalar setting, always
    # setting the "use" flag before the value it gates. List/map/struct
    # fields (customRootNameServers, dnssecTrustedKeys,
    # dnssecNegativeTrustAnchors, dns64Groups, ddnsRestrictPatternsList,
    # filterAaaaList, fixedRrsetOrderFqdns, forwarders, matchClients,
    # matchDestinations, nxdomainRedirectAddresses[V6], nxdomainRulesets,
    # blacklistRedirectAddresses, blacklistRulesets, responseRateLimiting,
    # scavengingSettings, sortlist, extAttrs) are not safe scalar
    # update-test targets and are skipped. Fields whose "enable" semantics
    # require non-empty companion data that this minimal example doesn't
    # provide (forwardOnly needs forwarders; nxdomainRedirect needs
    # nxdomainRedirectAddresses; enableBlacklist needs blacklistRulesets and,
    # when blacklistAction is REDIRECT, blacklistRedirectAddresses;
    # dns64Enabled needs dns64Groups) are skipped, while their override
    # ("use") flags are still exercised since flipping the override alone is
    # a valid, harmless state. Confirmed live against a scratch Grid object:
    # enableFixedRrsetOrderFqdns, enableMatchRecursiveOnly, and the dnssec*
    # enable flags accept true with their companion lists/keys left empty —
    # no business-rule dependency, so they stay value-tested.
    # filterAaaa and rootNameServerType are
    # Grid-specific string enumerations not enforced by the CRD schema, so
    # no safe value can be assumed without a live Grid to validate
    # against — skipped. ddnsPrincipalGroup references a pre-existing Grid
    # DDNS principal cluster group not modeled by this standalone example.
    # name is mutable but renaming rotates the WAPI `_ref` (DNSView is in
    # the _ref-unstable resource group); that rotation is already
    # exercised by controller unit tests. networkView is a structural
    # reassociation requiring a second NetworkView object not created by
    # this example.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: disable
        value: true
      - field: notifyDelay
        value: 10
      - field: useBlacklist
        value: true
      - field: blacklistAction
        value: "REDIRECT"
      - field: blacklistLogQuery
        value: true
      - field: blacklistRedirectTtl
        value: 300
      - field: useDdnsForceCreationTimestampUpdate
        value: true
      - field: ddnsForceCreationTimestampUpdate
        value: true
      - field: useDdnsPrincipalSecurity
        value: true
      - field: ddnsPrincipalTracking
        value: true
      - field: ddnsRestrictSecure
        value: true
      - field: useDdnsPatternsRestriction
        value: true
      - field: ddnsRestrictPatterns
        value: true
      - field: useDdnsRestrictProtected
        value: true
      - field: ddnsRestrictProtected
        value: true
      - field: useDdnsRestrictStatic
        value: true
      - field: ddnsRestrictStatic
        value: true
      - field: useDns64
        value: true
      - field: useDnssec
        value: true
      - field: dnssecEnabled
        value: true
      - field: dnssecExpiredSignaturesEnabled
        value: true
      - field: dnssecValidationEnabled
        value: true
      - field: useFixedRrsetOrderFqdns
        value: true
      - field: enableFixedRrsetOrderFqdns
        value: true
      - field: enableMatchRecursiveOnly
        value: true
      - field: useFilterAaaa
        value: true
      - field: useForwarders
        value: true
      - field: useLameTtl
        value: true
      - field: lameTtl
        value: 60
      - field: useMaxCacheTtl
        value: true
      - field: maxCacheTtl
        value: 3600
      - field: useMaxNcacheTtl
        value: true
      - field: maxNcacheTtl
        value: 900
      - field: useNxdomainRedirect
        value: true
      - field: nxdomainLogQuery
        value: true
      - field: nxdomainRedirectTtl
        value: 300
      - field: useRecursion
        value: true
      - field: recursion
        value: true
      - field: useResponseRateLimiting
        value: true
      - field: useRootNameServer
        value: true
      - field: useRpzDropIpRule
        value: true
      - field: rpzDropIpRuleEnabled
        value: true
      - field: rpzDropIpRuleMinPrefixLengthIpv4
        value: 24
      - field: rpzDropIpRuleMinPrefixLengthIpv6
        value: 64
      - field: useRpzQnameWaitRecurse
        value: true
      - field: rpzQnameWaitRecurse
        value: true
      - field: useScavengingSettings
        value: true
      - field: useSortlist
        value: true
      - field: name
        skip: "renaming rotates the WAPI _ref (DNSView is in the _ref-unstable resource group); covered by controller unit tests instead"
      - field: networkView
        skip: "structural reassociation requiring a second NetworkView object not created by this standalone example"
      - field: ddnsPrincipalGroup
        skip: "references a pre-existing Grid DDNS principal cluster group not modeled by this standalone example"
      - field: filterAaaa
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: rootNameServerType
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: forwardOnly
        skip: "requires the forwarders list (skipped below) to be non-empty per WAPI business rules"
      - field: nxdomainRedirect
        skip: "requires nxdomainRedirectAddresses (skipped below) to be non-empty per WAPI business rules"
      - field: enableBlacklist
        skip: "requires blacklistRulesets (skipped below, a reference to a pre-existing Grid Ruleset object) to be non-empty per WAPI business rules, and additionally blacklistRedirectAddresses (also skipped below) when blacklistAction is REDIRECT; blacklistAction/blacklistLogQuery/blacklistRedirectTtl remain update-tested since they are settable while the blacklist itself is disabled"
      - field: dns64Enabled
        skip: "requires the dns64Groups list (skipped below) to be non-empty per WAPI business rules (\"DNS64 cannot be enabled unless at least one synthesis group is configured\"); the useDns64 override flag is still exercised"
      - field: blacklistRedirectAddresses
        skip: "list field, not a scalar update-test target"
      - field: blacklistRulesets
        skip: "list field, not a scalar update-test target"
      - field: customRootNameServers
        skip: "list field, not a scalar update-test target"
      - field: ddnsRestrictPatternsList
        skip: "list field, not a scalar update-test target"
      - field: dns64Groups
        skip: "list field, not a scalar update-test target"
      - field: dnssecNegativeTrustAnchors
        skip: "list field, not a scalar update-test target"
      - field: dnssecTrustedKeys
        skip: "list field, not a scalar update-test target"
      - field: filterAaaaList
        skip: "list field, not a scalar update-test target"
      - field: fixedRrsetOrderFqdns
        skip: "list field, not a scalar update-test target"
      - field: forwarders
        skip: "list field, not a scalar update-test target"
      - field: matchClients
        skip: "list field, not a scalar update-test target"
      - field: matchDestinations
        skip: "list field, not a scalar update-test target"
      - field: nxdomainRedirectAddresses
        skip: "list field, not a scalar update-test target"
      - field: nxdomainRedirectAddressesV6
        skip: "list field, not a scalar update-test target"
      - field: nxdomainRulesets
        skip: "list field, not a scalar update-test target"
      - field: responseRateLimiting
        skip: "struct field, not a scalar update-test target"
      - field: scavengingSettings
        skip: "struct field, not a scalar update-test target"
      - field: sortlist
        skip: "list field, not a scalar update-test target"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: crossplane-test-view
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
