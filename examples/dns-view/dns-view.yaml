# DNSView is a cluster-scoped Infoblox NIOS DNS view (WAPI object type
# view). See dns-view-namespaced.yaml for the namespace-scoped variant used
# by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI POST returns an opaque `_ref` string
# (e.g. "view/ZG5zLnZpZXckY3Jvc3NwbGFuZS10ZXN0LXZpZXcvZmFsc2U:crossplane-test-view/false")
# from Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it. Create is synchronous — WAPI's POST returns the `_ref`
# immediately (200/201), so the default uptest timeout is sufficient.
#
# Well-known-default pattern: the NIOS Grid Manager always ships three
# pre-existing views ("default", "External", "Internal"). This example
# creates a distinct custom view instead of trying to re-create one of
# those, so it never collides with a fresh Grid Manager's built-in views.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same view name. Left literal
# ("${data.runToken}") if no datasource is supplied, which is exactly the
# pre-isolation behavior this guards against. This resource creates the
# view itself (unlike most other examples, which only reference an
# existing view by name, e.g. "default" — those stay literal).
#
# Required fields:
#   name: name of the DNS view. Renaming an existing view changes its
#         `_ref` — the controller re-reads `_ref` from the PUT response
#         and updates the external-name annotation.
#
# Optional mutable fields: comment, networkView, disable, and many more
# advanced DNS-tuning fields (blacklist, DDNS, DNS64, filtering, etc. — see
# the DNSView CRD schema for the full list). `isDefault` is a response-only
# field (WAPI supports=sr) and is never set here.
apiVersion: dnsview.infobloxnios.crossplane.io/v1alpha1
kind: DNSView
metadata:
  name: example-dnsview
  annotations:
    meta.upbound.io/example-id: dnsview/v1alpha1/dnsview
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dns-view.sh
    # DNSView has ~70 mutable fields, most gated by a paired "use" flag
    # (the pattern documented on record TTL fields elsewhere in this
    # catalog — see record-cname.yaml — generalized across the whole
    # resource).
    #
    # ── Tested-field budget: client-go's per-object Event spam-filter ──
    # crossplane-runtime's managed reconciler emits exactly ONE identical
    # Event per successful Update() call (reason UpdatedExternalResource,
    # a fixed message string, no per-field detail — this is generic
    # runtime behavior, not specific to this controller). client-go's
    # EventBroadcaster throttles repeated events sharing the same
    # (object, reason, message) key with a token-bucket spam filter:
    # burst=25, refilling at only 1 token/300s once exhausted
    # (k8s.io/client-go/tools/record: defaultSpamBurst=25,
    # defaultSpamQPS=1/300). That bucket lives in the running controller
    # pod's in-memory EventBroadcaster for the whole e2e session, so
    # splitting a test run into multiple `update-tester run` invocations
    # does NOT reset it — the state is per-controller-process, not
    # per-CLI-invocation. Once the 25-event burst for a given DNSView
    # object is spent, further genuine Update() calls still reach the
    # WAPI backend (confirmed live via `kubectl get dnsview -o yaml`:
    # spec.forProvider and status.atProvider agree on every field) but
    # produce no new Event object for update-tester's per-field
    # before/after evidence check to see — a false NOT-EVIDENCED, not a
    # controller defect. Reproduced live: testing all 49 mutable scalar
    # fields in one pass reliably failed with exactly this signature
    # starting at field #26 (`FAIL: 27/49 tested ... 22 not-evidenced`).
    # DNSView is, by a wide margin, the only resource in this catalog
    # large enough to hit this ceiling (next largest tested-field count
    # elsewhere: 7).
    #
    # The fix applied here: keep the live-tested field count safely under
    # the 25-event ceiling by testing one representative field per gated
    # feature group (22 fields below carry `value:`) instead of every
    # field in every group. This still exercises the Update() path for
    # every feature area at least once with real Event evidence; fields
    # skipped purely for this reason carry a `skip:` note pointing back
    # here rather than a `value:`. A durable, general fix — teaching
    # update-tester's evidence check to tolerate the spam filter (e.g. by
    # detecting genuine convergence a different way for high-field-count
    # resources) — would remove the need for this trim, but that logic
    # lives in tools/update-tester, outside this file's charter.
    #
    # List/map/struct fields (customRootNameServers, dnssecTrustedKeys,
    # dnssecNegativeTrustAnchors, dns64Groups, ddnsRestrictPatternsList,
    # filterAaaaList, fixedRrsetOrderFqdns, forwarders, matchClients,
    # matchDestinations, nxdomainRedirectAddresses[V6], nxdomainRulesets,
    # blacklistRedirectAddresses, blacklistRulesets, responseRateLimiting,
    # scavengingSettings, sortlist, extAttrs) are not safe scalar
    # update-test targets and are skipped regardless of the budget above.
    # Fields whose "enable" semantics require non-empty companion data
    # that this minimal example doesn't provide (forwardOnly needs
    # forwarders; nxdomainRedirect needs nxdomainRedirectAddresses;
    # enableBlacklist needs blacklistRulesets and, when blacklistAction is
    # REDIRECT, blacklistRedirectAddresses; dns64Enabled needs
    # dns64Groups) are skipped, while their override ("use") flags are
    # still exercised (when they fall inside the tested-field budget)
    # since flipping the override alone is a valid, harmless state.
    # Confirmed live against a scratch Grid object: enableFixedRrsetOrderFqdns,
    # enableMatchRecursiveOnly, and the dnssec* enable flags accept true
    # with their companion lists/keys left empty — no business-rule
    # dependency, so they stay value-tested. blacklistAction targets
    # "REFUSE" — a live scratch-object check against the Grid showed it
    # already returns "REDIRECT" on a freshly created view (a Grid-level
    # customization, not the vendor-documented default), so the original
    # "REDIRECT" target never actually exercised Update(); the value here
    # was chosen to genuinely differ from that observed default (the
    # analogous dnssecValidationEnabled/true-vs-false finding applies to a
    # field that is, for budget reasons, no longer in the live-tested set
    # below — see its skip note). filterAaaa and rootNameServerType are
    # Grid-specific string enumerations not enforced by the CRD schema, so
    # no safe value can be assumed without a live Grid to validate
    # against — skipped. ddnsPrincipalGroup references a pre-existing Grid
    # DDNS principal cluster group not modeled by this standalone example.
    # name is mutable but renaming rotates the WAPI `_ref` (DNSView is in
    # the _ref-unstable resource group); that rotation is already
    # exercised by controller unit tests. networkView is a structural
    # reassociation requiring a second NetworkView object not created by
    # this example.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: disable
        value: true
      - field: notifyDelay
        value: 10
      - field: useBlacklist
        value: true
      - field: blacklistAction
        value: "REFUSE"
      - field: useDdnsForceCreationTimestampUpdate
        value: true
      - field: ddnsForceCreationTimestampUpdate
        value: true
      - field: useDdnsPrincipalSecurity
        value: true
      - field: ddnsRestrictSecure
        value: true
      - field: useDns64
        value: true
      - field: useDnssec
        value: true
      - field: dnssecEnabled
        value: true
      - field: useFixedRrsetOrderFqdns
        value: true
      - field: enableFixedRrsetOrderFqdns
        value: true
      - field: enableMatchRecursiveOnly
        value: true
      - field: useLameTtl
        value: true
      - field: lameTtl
        value: 60
      - field: useMaxCacheTtl
        value: true
      - field: maxCacheTtl
        value: 3600
      - field: useRecursion
        value: true
      - field: recursion
        value: true
      - field: useSortlist
        value: true
      - field: name
        skip: "renaming rotates the WAPI _ref (DNSView is in the _ref-unstable resource group); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: networkView
        skip: "structural reassociation requiring a second NetworkView object not created by this standalone example"
      - field: ddnsPrincipalGroup
        skip: "references a pre-existing Grid DDNS principal cluster group not modeled by this standalone example"
      - field: filterAaaa
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: rootNameServerType
        skip: "Grid-specific string enumeration not enforced by the CRD schema; no safe value can be assumed without a live Grid to validate against"
      - field: forwardOnly
        skip: "requires the forwarders list (skipped below) to be non-empty per WAPI business rules"
      - field: nxdomainRedirect
        skip: "requires nxdomainRedirectAddresses (skipped below) to be non-empty per WAPI business rules"
      - field: enableBlacklist
        skip: "requires blacklistRulesets (skipped below, a reference to a pre-existing Grid Ruleset object) to be non-empty per WAPI business rules, and additionally blacklistRedirectAddresses (also skipped below) when blacklistAction is REDIRECT; blacklistAction remains update-tested since it is settable while the blacklist itself is disabled"
      - field: dns64Enabled
        skip: "requires the dns64Groups list (skipped below) to be non-empty per WAPI business rules (\"DNS64 cannot be enabled unless at least one synthesis group is configured\"); the useDns64 override flag is still exercised"
      - field: blacklistLogQuery
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment for the full explanation and the representative field list that stays tested); this group's Update() path is already evidenced via blacklistAction above"
      - field: blacklistRedirectTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via blacklistAction above"
      - field: ddnsPrincipalTracking
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via useDdnsPrincipalSecurity above"
      - field: useDdnsPatternsRestriction
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictPatterns
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: useDdnsRestrictProtected
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictProtected
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: useDdnsRestrictStatic
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: ddnsRestrictStatic
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); the ddns-restriction family's Update() path is already evidenced via ddnsRestrictSecure above"
      - field: dnssecExpiredSignaturesEnabled
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via dnssecEnabled above"
      - field: dnssecValidationEnabled
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via dnssecEnabled above"
      - field: useFilterAaaa
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useForwarders
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useMaxNcacheTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via useMaxCacheTtl/maxCacheTtl above"
      - field: maxNcacheTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); this group's Update() path is already evidenced via useMaxCacheTtl/maxCacheTtl above"
      - field: useNxdomainRedirect
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: nxdomainLogQuery
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: nxdomainRedirectTtl
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useResponseRateLimiting
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useRootNameServer
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useRpzDropIpRule
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: rpzDropIpRuleEnabled
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: rpzDropIpRuleMinPrefixLengthIpv4
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: rpzDropIpRuleMinPrefixLengthIpv6
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useRpzQnameWaitRecurse
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: rpzQnameWaitRecurse
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: useScavengingSettings
        skip: "excluded from live per-field testing solely to keep this run's tested-field count under client-go's ~25-event-per-object Event spam-filter burst ceiling (see header comment); not independently represented in the reduced tested set"
      - field: blacklistRedirectAddresses
        skip: "list field, not a scalar update-test target"
      - field: blacklistRulesets
        skip: "list field, not a scalar update-test target"
      - field: customRootNameServers
        skip: "list field, not a scalar update-test target"
      - field: ddnsRestrictPatternsList
        skip: "list field, not a scalar update-test target"
      - field: dns64Groups
        skip: "list field, not a scalar update-test target"
      - field: dnssecNegativeTrustAnchors
        skip: "list field, not a scalar update-test target"
      - field: dnssecTrustedKeys
        skip: "list field, not a scalar update-test target"
      - field: filterAaaaList
        skip: "list field, not a scalar update-test target"
      - field: fixedRrsetOrderFqdns
        skip: "list field, not a scalar update-test target"
      - field: forwarders
        skip: "list field, not a scalar update-test target"
      - field: matchClients
