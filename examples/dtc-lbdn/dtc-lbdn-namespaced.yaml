# DTCLBDN is the namespace-scoped variant of the Infoblox NIOS DTC (DNS
# Traffic Control) Load Balanced Domain Name. See dtc-lbdn.yaml for the
# cluster-scoped variant and full field documentation — this file only
# documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the name below differs from dtc-lbdn.yaml's so both
# examples can be applied to the same NIOS Grid Manager at once without
# colliding on the same DTC LBDN display name.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same LBDN display name. Left literal
# ("${data.runToken}") if no datasource is supplied, which is exactly the
# pre-isolation behavior this guards against.
apiVersion: dtclbdn.infobloxnios.m.crossplane.io/v1alpha1
kind: DTCLBDN
metadata:
  name: example-dtclbdn-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: dtclbdn/v1alpha1/dtclbdn
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # dtc-lbdn.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dtc-lbdn-namespaced.sh
    # See dtc-lbdn.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: lbMethod
        value: "RATIO"
      - field: priority
        value: 5
      - field: persistence
        value: 300
      - field: disable
        value: true
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "mutable but changes the WAPI _ref per the field documentation; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: patterns
        skip: "required list field, not a scalar update-test target"
      - field: types
        skip: "list field of enum values, not a scalar update-test target"
      - field: pools
        skip: "references DTCPool resources, intentionally omitted from this standalone example"
      - field: authZones
        skip: "references ZoneAuth resources, intentionally omitted from this standalone example"
      - field: authZonesRefs
        skip: "references ZoneAuth resources, intentionally omitted from this standalone example"
      - field: topology
        skip: "only meaningful when lbMethod=TOPOLOGY; not used by this example's RATIO method"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-dtc-lbdn-ns-${data.runToken}
    lbMethod: ROUND_ROBIN
    patterns:
      - "*.namespaced.${data.runToken}.example.com"
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
