# DTCLBDN is a cluster-scoped Infoblox NIOS DTC (DNS Traffic Control)
# Load Balanced Domain Name (WAPI object type dtc:lbdn). See
# dtc-lbdn-namespaced.yaml for the namespace-scoped variant used by
# namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI POST returns an opaque `_ref` string
# from Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it. Create is synchronous — WAPI's POST returns the `_ref`
# immediately (200/201), so the default uptest timeout is sufficient.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same LBDN display name. Left literal
# ("${data.runToken}") if no datasource is supplied, which is exactly the
# pre-isolation behavior this guards against.
#
# patterns is ALSO tokenised below, even though a live-Grid check found
# WAPI does not actually require it: two DTCLBDN objects were created
# back to back with an identical patterns entry and both Creates
# succeeded, persisting independently with the duplicate value intact
# (no rejection, no observable interference at the Create/Update/Delete
# layer these tests exercise) — scratch objects were deleted after the
# check. Tokenising patterns anyway costs nothing here and is strictly
# more defensive than relying on that finding indefinitely, so it stays
# in place; recording the finding so a future reader does not assume
# duplicate patterns are unsafe (or spend time re-verifying that they
# are not) before touching this field again.
#
# Required fields:
#   name: DTC LBDN display name (not DNS-related).
#   lbMethod: load balancing method used to select a pool from those
#     listed in pools. ROUND_ROBIN is the simplest enum value and needs no
#     companion settings (unlike TOPOLOGY or GLOBAL_AVAILABILITY, which
#     require a topology ruleset or monitor configuration respectively).
#   patterns: FQDN wildcard patterns matched against incoming queries. At
#     least one pattern is required for the LBDN to answer any query.
#
# The `pools` (DTCPool members, by external name) and `authZones`
# (authoritative ZoneAuth zones, by external name) fields are optional and
# intentionally omitted here — they reference other managed resources that
# may not exist in a minimal test, and this example is meant to stand alone.
#
# Optional mutable fields: pools, authZones, types, priority, persistence,
# topology, ttl, useTtl, comment, disable, extAttrs — see the DTCLBDN CRD
# schema for the full list.
apiVersion: dtclbdn.infobloxnios.crossplane.io/v1alpha1
kind: DTCLBDN
metadata:
  name: example-dtclbdn
  annotations:
    meta.upbound.io/example-id: dtclbdn/v1alpha1/dtclbdn
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dtc-lbdn.sh
    # comment, lbMethod, priority, persistence, and disable are the mutable
    # scalars exercised here. lbMethod moves to RATIO, which needs no
    # companion topology ruleset or monitor configuration (unlike TOPOLOGY
    # or GLOBAL_AVAILABILITY) and works with the empty `pools` list this
    # minimal example uses. ttl and useTtl are both skipped — unlike CNAME
    # (record-cname.yaml), where useTtl flips safely alone, live E2E found
    # dtc:lbdn requires the two fields in the SAME request in both
    # directions: submitting useTtl=true without ttl is rejected outright
    # (AdmConDataError: "Enter a ttl value", permanent ReconcileError,
    # confirmed across 4 retries); submitting ttl alone while useTtl stays
    # false is accepted but silently not persisted (status.atProvider.ttl
    # never leaves "", confirmed by a 121s poll timeout). The per-field
    # update-test harness patches one field at a time and cannot submit
    # both atomically, so neither ordering converges — see the skip
    # entries below. name is also mutable, but changes the WAPI `_ref`
    # per the field documentation; that rotation is already exercised by
    # controller unit tests, so it is skipped here. patterns and types
    # are list fields, not scalar update-test targets.
    # pools/authZones/authZonesRefs reference other managed resources and
    # are intentionally omitted from this standalone example (see the
    # field doc above). topology is only meaningful when lbMethod=TOPOLOGY,
    # not used by this example's RATIO method. extAttrs is an optional
    # map field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: lbMethod
        value: "RATIO"
      - field: priority
        value: 2
      - field: persistence
        value: 300
      - field: disable
        value: true
      - field: ttl
        skip: "companion field of useTtl — live E2E confirmed neither field converges when patched alone (see the field-doc comment above); the per-field harness cannot submit both in one request"
      - field: useTtl
        skip: "companion field of ttl — see the ttl skip reason and the field-doc comment above"
      - field: name
        skip: "mutable but changes the WAPI _ref per the field documentation; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: patterns
        skip: "required list field, not a scalar update-test target"
      - field: types
        skip: "list field of enum values, not a scalar update-test target"
      - field: pools
        skip: "references DTCPool resources, intentionally omitted from this standalone example"
      - field: authZones
        skip: "references ZoneAuth resources, intentionally omitted from this standalone example"
      - field: authZonesRefs
        skip: "references ZoneAuth resources, intentionally omitted from this standalone example"
      - field: topology
        skip: "only meaningful when lbMethod=TOPOLOGY; not used by this example's RATIO method"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-dtc-lbdn-${data.runToken}
    lbMethod: ROUND_ROBIN
    patterns:
      - "*.${data.runToken}.example.com"
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
