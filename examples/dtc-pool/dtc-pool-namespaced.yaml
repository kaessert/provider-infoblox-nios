# DTCPool is the namespace-scoped variant of the Infoblox NIOS DTC (DNS
# Traffic Control) pool. See dtc-pool.yaml for the cluster-scoped variant
# and full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the name below differs from dtc-pool.yaml's so both
# examples can be applied to the same NIOS Grid Manager at once without
# colliding on the same DTC Pool display name.
apiVersion: dtcpool.infobloxnios.m.crossplane.io/v1alpha1
kind: DTCPool
metadata:
  name: example-dtcpool-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: dtcpool/v1alpha1/dtcpool
    uptest.upbound.io/timeout: "600"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # dtc-pool.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dtc-pool-namespaced.sh
    # See dtc-pool.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: lbPreferredMethod
        value: "SOURCE_IP_HASH"
      - field: lbAlternateMethod
        value: "ROUND_ROBIN"
      - field: availability
        value: "QUORUM"
      - field: quorum
        value: 1
      - field: disable
        value: true
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "renaming a DTC Pool may change its WAPI _ref; covered by controller unit tests instead"
      - field: lbPreferredTopology
        skip: "only meaningful when lbPreferredMethod=TOPOLOGY; not used by this example's SOURCE_IP_HASH/ROUND_ROBIN methods"
      - field: lbAlternateTopology
        skip: "only meaningful when lbAlternateMethod=TOPOLOGY; not used by this example's SOURCE_IP_HASH/ROUND_ROBIN methods"
      - field: lbDynamicRatioPreferred
        skip: "only meaningful when lbPreferredMethod=DYNAMIC_RATIO; not used by this example's SOURCE_IP_HASH/ROUND_ROBIN methods"
      - field: lbDynamicRatioAlternate
        skip: "only meaningful when lbAlternateMethod=DYNAMIC_RATIO; not used by this example's SOURCE_IP_HASH/ROUND_ROBIN methods"
      - field: servers
        skip: "references DTCServer resources, intentionally omitted from this standalone example"
      - field: monitors
        skip: "list field of health monitors, not a scalar update-test target"
      - field: extattrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-dtc-pool-ns
    lbPreferredMethod: ROUND_ROBIN
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
