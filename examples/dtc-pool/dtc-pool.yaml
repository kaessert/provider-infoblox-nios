# DTCPool is a cluster-scoped Infoblox NIOS DTC (DNS Traffic Control) pool
# (WAPI object type dtc:pool). See dtc-pool-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI POST returns an opaque `_ref` string
# from Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it. Create is synchronous — WAPI's POST returns the `_ref`
# immediately (200/201), so the default uptest timeout is sufficient.
#
# Required fields:
#   name: DTC Pool display name.
#   lbPreferredMethod: preferred load-balancing method used to select a
#     server from the pool. ROUND_ROBIN is the simplest enum value and
#     needs no companion settings (unlike TOPOLOGY or DYNAMIC_RATIO, which
#     require a topology ruleset or monitor configuration respectively).
#
# The `servers` field (DTC Servers that are members of this pool) is
# optional and intentionally omitted here — it references DTCServer
# resources by external name, and this minimal example is meant to stand
# alone without requiring a pre-existing DTCServer.
#
# Optional mutable fields: lbAlternateMethod, servers, availability,
# quorum, comment, disable, ttl, useTtl, extAttrs, and more advanced
# dynamic-ratio/topology settings — see the DTCPool CRD schema for the
# full list.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same DTC Pool display name. Left literal
# ("${data.runToken}") if no datasource is supplied, which is exactly the
# pre-isolation behavior this guards against.
apiVersion: dtcpool.infobloxnios.crossplane.io/v1alpha1
kind: DTCPool
metadata:
  name: example-dtcpool
  annotations:
    meta.upbound.io/example-id: dtcpool/v1alpha1/dtcpool
    uptest.upbound.io/timeout: "600"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dtc-pool.sh
    # comment, lbPreferredMethod, lbAlternateMethod, availability,
    # disable, useTtl, and ttl are the mutable scalars exercised here.
    # lbPreferredMethod moves to ALL_AVAILABLE and lbAlternateMethod to
    # ROUND_ROBIN — both need no companion topology/dynamic-ratio settings
    # (unlike TOPOLOGY or DYNAMIC_RATIO). ALL_AVAILABLE is used because the
    # live Grid's WAPI does not accept SOURCE_IP_HASH for lb_preferred_method
    # ("valid values are: GLOBAL_AVAILABILITY, RATIO, ROUND_ROBIN, TOPOLOGY,
    # ALL_AVAILABLE, DYNAMIC_RATIO"); the CRD's lbPreferredMethod enum
    # matches that same set and does not offer SOURCE_IP_HASH. availability moves to
    # ANY, not QUORUM: a live-Grid WAPI update confirmed QUORUM requires
    # the pool to already have at least one associated health monitor
    # ("Pool ... contains only 0 effective monitors but requires at least
    # 1 for its availability"), which this standalone example intentionally
    # has none of (see the monitors skip rationale below) — ANY carries no
    # such requirement and updates cleanly with zero monitors. quorum is
    # therefore skipped too (see below), since it is only meaningful under
    # availability=QUORUM. ttl carries a literal baseline (1800) in
    # spec.forProvider below rather than being left unset: a live-Grid
    # WAPI Create/Update confirmed that submitting a ttl value with no
    # use_ttl key implicitly turns use_ttl on ("Enter a TTL value" is only
    # raised when use_ttl is set true with no ttl ever having been given).
    # Baking ttl into Create means useTtl is already true by the time the
    # update-test steps run (back-filled from the observed object by
    # lateInitialize), so the update-test only needs to change ttl's VALUE
    # (a real, observable drift) and then flip useTtl to false (the
    # reverse transition) — both of which a live-Grid PUT confirmed work
    # standalone. Testing useTtl=true as its own step was tried first and
    # doesn't work here: the controller's own isUpToDate skips comparing
    # ttl whenever useTtl is false (deliberately, to avoid phantom drift
    # against WAPI's zone-default ttl — see the controller's
    # scalarFieldsUpToDate), so a ttl-then-useTtl step order never issues
    # the Update that would set ttl, and a useTtl-then-ttl order hits the
    # "Enter a TTL value" rejection instead; baking ttl into Create is the
    # only ordering that avoids both failure modes with this tool's
    # one-field-per-step model. name is also mutable, but renaming a DTC Pool may change its WAPI
    # _ref; that rotation is already exercised by controller unit tests,
    # so it is skipped here. lbPreferredTopology/lbAlternateTopology and
    # lbDynamicRatioPreferred/lbDynamicRatioAlternate are only meaningful
    # for the TOPOLOGY/DYNAMIC_RATIO methods this example does not use.
    # servers references DTCServer resources and is intentionally omitted
    # from this standalone example (see the field doc above). monitors is
    # a list field, not a scalar update-test target. extAttrs is an
    # optional map field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: lbPreferredMethod
        value: "ALL_AVAILABLE"
      - field: lbAlternateMethod
        value: "ROUND_ROBIN"
      - field: availability
        value: "ANY"
      - field: disable
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "renaming a DTC Pool may change its WAPI _ref; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: quorum
        skip: "only meaningful when availability=QUORUM; this example exercises availability=ANY (see the availability rationale above), so quorum has no effect to observe"
      - field: lbPreferredTopology
        skip: "only meaningful when lbPreferredMethod=TOPOLOGY; not used by this example's ALL_AVAILABLE/ROUND_ROBIN methods"
      - field: lbAlternateTopology
        skip: "only meaningful when lbAlternateMethod=TOPOLOGY; not used by this example's ALL_AVAILABLE/ROUND_ROBIN methods"
      - field: lbDynamicRatioPreferred
        skip: "only meaningful when lbPreferredMethod=DYNAMIC_RATIO; not used by this example's ALL_AVAILABLE/ROUND_ROBIN methods"
      - field: lbDynamicRatioAlternate
        skip: "only meaningful when lbAlternateMethod=DYNAMIC_RATIO; not used by this example's ALL_AVAILABLE/ROUND_ROBIN methods"
      - field: servers
        skip: "references DTCServer resources, intentionally omitted from this standalone example"
      - field: monitors
        skip: "list field of health monitors, not a scalar update-test target; also the reason availability=QUORUM is not exercised here, see above"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-dtc-pool-${data.runToken}
    lbPreferredMethod: ROUND_ROBIN
    comment: Managed by Crossplane
    ttl: 1800
  providerConfigRef:
    name: default
