# DTCServer is a cluster-scoped Infoblox NIOS DTC (DNS Traffic Control)
# server (WAPI object type dtc:server). See dtc-server-namespaced.yaml for
# the namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI POST returns an opaque `_ref` string
# (e.g. "dtc:server/ZG5zLmRfoi5zZXJ2ZXIkX2V4YW1wbGU:example-server") from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it. Create is synchronous — WAPI's POST returns the `_ref`
# immediately (200/201), so the default uptest timeout is sufficient.
#
# Required fields:
#   name: DTC Server display name.
#   host: address or FQDN of the backend server.
#
# Optional mutable fields: comment, disable, autoCreateHostRecord,
# sniHostname, useSniHostname, monitors, extAttrs.
apiVersion: dtcserver.infobloxnios.crossplane.io/v1alpha1
kind: DTCServer
metadata:
  name: example-dtcserver
  annotations:
    meta.upbound.io/example-id: dtcserver/v1alpha1/dtcserver
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-dtc-server.sh
    # comment, host, disable, autoCreateHostRecord, useSniHostname, and
    # sniHostname are the mutable scalars exercised here — DTCServer has
    # no known immutable fields (all Create parameters are also accepted
    # by Update). useSniHostname is tested before sniHostname (same
    # use-flag-then-value ordering as the DNS record TTL fields — see
    # record-cname.yaml). autoCreateHostRecord targets true: the
    # controller always transmits auto_create_host_record explicitly on
    # Create (the field is built from a value-type constructor parameter,
    # not a pointer, so an unset spec field still serializes as false
    # rather than being omitted from the request). That means the object
    # is created holding false regardless of what the backend's own
    # create-time default would be if the field were left off the wire
    # entirely, so true is the value that genuinely differs after Create
    # and actually exercises Update(). name is also
    # mutable, but renaming a DTC Server may change its WAPI _ref; that
    # rotation is already exercised by controller unit tests, so it is
    # skipped here. monitors is a list
    # field, not a scalar update-test target. extattrs is an optional map
    # field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: host
        value: "192.0.2.31"
      - field: disable
        value: true
      - field: autoCreateHostRecord
        value: true
      - field: useSniHostname
        value: true
      - field: sniHostname
        value: "sni.example.com"
      - field: name
        skip: "renaming a DTC Server may change its WAPI _ref; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: monitors
        skip: "list field of IP/FQDN and monitor pairs, not a scalar update-test target"
      - field: extattrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: example-server.example.com
    host: 192.0.2.30
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
