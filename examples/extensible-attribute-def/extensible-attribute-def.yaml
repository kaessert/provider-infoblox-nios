# ExtensibleAttributeDef is a cluster-scoped Infoblox NIOS extensible
# attribute definition (WAPI object type extensibleattributedef). See
# extensible-attribute-def-namespaced.yaml for the namespace-scoped variant
# used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 200), so the default uptest timeout is sufficient.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same extensible attribute definition `name`.
# Left literal ("${data.runToken}") if no datasource is supplied, which is
# exactly the pre-isolation behavior this guards against.
#
# Scope of this tokenisation: it applies ONLY to the EA definition THIS
# example creates. It does NOT touch, and must never be confused with, the
# reserved EA definition named "Crossplane Internal ID" that the identity
# ladder stamps onto every managed object across the whole provider (the
# UID-in-EA mechanism). That definition is shared, provider-wide
# infrastructure created once and reused by every reconcile of every
# resource — it is not created or owned by this example, must never be
# tokenised, and must never be deleted by this example's cleanup.
#
# Required fields:
#   name: unique name of the Extensible Attribute Definition. Mutable —
#         renaming changes the record's _ref.
#   type: data type of the attribute's value. Immutable after creation
#         (CEL rule enforced) — WAPI rejects a change with "Type of
#         extensible attribute definition cannot be modified". STRING is
#         the simplest type for testing.
#
# Optional mutable fields: comment, defaultValue, flags, listValues,
# allowedObjectTypes.
apiVersion: extensibleattributedef.infobloxnios.crossplane.io/v1alpha1
kind: ExtensibleAttributeDef
metadata:
  name: example-ea-def
  annotations:
    meta.upbound.io/example-id: extensibleattributedef/v1alpha1/extensibleattributedef
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-extensible-attribute-def.sh
    # comment, defaultValue, and flags are the mutable scalars exercised
    # here — type/min/max are immutable (CEL-enforced) and can't be
    # exercised. name is also mutable but renaming rotates the WAPI
    # `_ref`; that rotation is already exercised by controller unit
    # tests, so it is skipped here. listValues only applies when
    # type=ENUM (this example uses type=STRING). allowedObjectTypes is a
    # list field skipped for low update-test value. descendantsAction is
    # write-only — never mirrored into the observed state, so it has no
    # comparable value for a convergence check.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: defaultValue
        value: "updated-default"
      - field: flags
        value: "A"
      - field: name
        skip: "renaming rotates the WAPI _ref; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: listValues
        skip: "applicable only when type=ENUM; this example uses type=STRING"
      - field: allowedObjectTypes
        skip: "list field, low update-test value"
      - field: descendantsAction
        skip: "write-only field, never mirrored into the observed state; not comparable for a convergence check"
spec:
  forProvider:
    name: example-ea-def-${data.runToken}
    type: STRING
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
