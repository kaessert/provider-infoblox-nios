# FixedAddress is the namespace-scoped variant of the Infoblox NIOS DHCP
# fixed address. See fixed-address.yaml for the cluster-scoped variant and
# full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: ${data.netFixedAddrHostNamespaced} (a host address
# nested inside network-prereq-namespaced.yaml's
# ${data.netFixedAddrParentNamespaced} /28) is a disjoint sub-block from
# fixed-address.yaml's ${data.netFixedAddrHostCluster} / parent — see the
# sub-allocation map in test/e2e/gen-datasource.sh's header comment — so
# both examples can be applied to the same NIOS Grid Manager (and the same
# E2E run's netPrefix) at once without colliding on the same address.
apiVersion: fixedaddress.infobloxnios.m.crossplane.io/v1alpha1
kind: FixedAddress
metadata:
  name: example-fixed-address-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: fixedaddress/v1alpha1/fixedaddress
    uptest.upbound.io/timeout: "120"
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-fixed-address-namespaced.sh
    # See fixed-address.yaml for the field coverage rationale (mac is
    # skipped for the same E2E-isolation reason: it is part of the
    # (networkView, network, ip, MAC) natural key; name is value-tested
    # because it does not participate in that key).
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: mac
        skip: "mac is part of this resource's (networkView, network, ip, MAC) natural key; networkView and network stay literal by design (ADR-IN-0007 scope discipline) and ipv4addr is per-run tokenised, so patching mac to a shared literal across concurrent runs would needlessly narrow the isolation margin down to the ip component alone — comment/disable/useOptions/name already exercise the update phase for this resource"
      - field: name
        value: "updated-fixed-address-ns"
      - field: matchClient
        skip: "this example sets a real, non-zero mac so Create lands in matchClient=MAC_ADDRESS (the all-zero mac is a Grid trap that silently produces matchClient=RESERVED instead — see fixed-address.yaml's mac field doc); live-verified on the Grid that every other match_client value clears the mac field as a side effect regardless — no value both differs from MAC_ADDRESS and leaves mac untouched"
      - field: disable
        value: true
      - field: useOptions
        value: true
      - field: ipv4addr
        skip: "changing it changes the record's UNSTABLE _ref (ADR-IN-0004); mutually exclusive with ipv6addr"
      - field: ipv6addr
        skip: "changing it changes the record's UNSTABLE _ref (ADR-IN-0004); mutually exclusive with ipv4addr"
      - field: networkView
        skip: "only safely mutable prior to first apply per the field documentation; not exercised post-create"
      - field: network
        skip: "only meaningful for dynamic CIDR allocation; this example uses a literal ipv4addr"
      - field: agentCircuitId
        skip: "only relevant when matchClient=CIRCUIT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: agentRemoteId
        skip: "only relevant when matchClient=REMOTE_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: dhcpClientIdentifier
        skip: "only relevant when matchClient=CLIENT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: clientIdentifierPrependZero
        skip: "only relevant alongside dhcpClientIdentifier/CLIENT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target"
spec:
  forProvider:
    ipv4addr: ${data.netFixedAddrHostNamespaced}
    mac: "00:00:00:00:0a:02"
    networkView: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
