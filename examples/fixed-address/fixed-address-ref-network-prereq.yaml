# fixed-address-ref-network-prereq.yaml — prerequisite parent Network for
# fixed-address-ref.yaml, provisioned inside network-view-ref-prereq.yaml's
# per-run custom NetworkView.
#
# FixedAddress's AllocateIP call (see fixed-address.yaml's field docs)
# unconditionally requires an existing parent Network object covering the
# address, resolved within the SAME network view the FixedAddress itself
# ends up in. Since fixed-address-ref.yaml resolves its networkView through
# networkViewRef to network-view-ref-prereq.yaml's custom view (not
# "default"), the parent Network covering its address must exist in that
# same custom view too — unlike examples/fixed-address/network-prereq.yaml,
# which covers the literal-networkView path and lives in "default".
#
# The literal networkView value below must match
# network-view-ref-prereq.yaml's spec.forProvider.name exactly: both are
# plain string literals built from the same ${data.runToken}, so there is
# no reference indirection needed here (only fixed-address-ref.yaml itself
# exercises the networkViewRef resolver — this manifest just needs to land
# in the same already-known view name).
#
# Makefile prerequisite-bundling (UPTEST_MANIFESTS_FIXED_ADDRESS) applies
# network-view-ref-prereq.yaml, then this manifest, then fixed-address-ref.
# yaml, in that order, so each dependency exists before the next needs it.
#
# ${data.netFixedAddrRefParentCluster}: a per-run /30 disjoint from every
# other addressed example's sub-block, including this directory's own
# ${data.netFixedAddrParentCluster}/${data.netFixedAddrParentNamespaced}
# (see test/e2e/gen-datasource.sh's sub-allocation map) — required because
# this manifest runs in the SAME e2e.fixed-address invocation as both of
# those, not a separate target. fixed-address-ref.yaml's own
# ${data.netFixedAddrRefHostCluster} address is a host inside this /30.
#
# This manifest intentionally carries no update-test annotation and no
# uptest.upbound.io/post-assert-hook annotation: fixed-address-ref.yaml's
# allocation depends on this object's CIDR staying stable for the whole
# run, and it is not itself a resource under test — see
# examples/network/network.yaml for the general-purpose, independently
# update-tested Network example.
apiVersion: network.infobloxnios.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-fixed-address-ref-network
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
spec:
  forProvider:
    networkView: "test-network-view-fixedaddr-ref-${data.runToken}"
    network: ${data.netFixedAddrRefParentCluster}
    comment: "Prerequisite parent network for fixed-address-ref.yaml (E2E isolation)"
  providerConfigRef:
    name: default
