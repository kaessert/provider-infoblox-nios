# FixedAddress (IPv6 variant) is the namespace-scoped variant of the
# Infoblox NIOS DHCP fixed address. See fixed-address-v6.yaml for the
# cluster-scoped variant, the dual-object-type rationale, and the DUID
# field note — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# ${data.netV6FixedAddrHostNamespaced}: injected by uptest from the
# --data-source file (see test/e2e/gen-datasource.sh), distinct from
# fixed-address-v6.yaml's ${data.netV6FixedAddrHostCluster} (::51 vs.
# ::50) so both examples can be applied to the same NIOS Grid Manager at
# once without colliding on the same address. Both share the SAME parent
# ${data.netV6FixedAddrParent} network, provisioned once by
# network-prereq-v6.yaml (see fixed-address-v6.yaml's prerequisite note)
# — mirroring how fixed-address.yaml and fixed-address-namespaced.yaml
# each get their OWN per-scope IPv4 prerequisite network, except the IPv6
# parent-network requirement is not Kubernetes-scope-aware, so one shared
# ipv6network object safely covers both scopes here.
apiVersion: fixedaddress.infobloxnios.m.crossplane.io/v1alpha1
kind: FixedAddress
metadata:
  name: example-fixed-address-v6-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: fixedaddress/v1alpha1/fixedaddress
    uptest.upbound.io/timeout: "120"
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-fixed-address-v6-namespaced.sh
    # See fixed-address-v6.yaml for the dual-object-type guard rationale.
    crossplane.io/expect-external-name-prefix: "ipv6fixedaddress/"
    # See fixed-address-v6.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (IPv6, namespaced)"
      - field: mac
        value: "00:01:00:01:29:c4:d5:e6:00:11:22:33:44:99"
      - field: name
        value: "updated-fixed-address-v6-ns"
      - field: matchClient
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: disable
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: useOptions
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: ipv4addr
        skip: "mutually exclusive with ipv6addr; this example uses ipv6addr"
      - field: ipv6addr
        skip: "changing it changes the record's _ref, which NIOS derives from the field values themselves, so the object identity moves; mutually exclusive with ipv4addr"
      - field: networkView
        skip: "only safely mutable prior to first apply per fixed-address.yaml's field documentation; not exercised post-create"
      - field: network
        skip: "only meaningful for dynamic CIDR allocation; this example uses a literal ipv6addr"
      - field: agentCircuitId
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: agentRemoteId
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: dhcpClientIdentifier
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: clientIdentifierPrependZero
        skip: "the controller's ipv6fixedaddress read path never confirms this field back (see fixed-address-v6.yaml's update-test annotation header) — value-testing it cannot converge"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target; also subject to the same read-path gap as the other DHCP-relay fields"
spec:
  forProvider:
    ipv6addr: ${data.netV6FixedAddrHostNamespaced}
    mac: "00:01:00:01:29:c4:d5:e6:00:11:22:33:44:66"
    networkView: default
    comment: Managed by Crossplane (IPv6, namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
