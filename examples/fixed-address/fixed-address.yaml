# FixedAddress is a cluster-scoped Infoblox NIOS DHCP fixed address (WAPI
# object type "fixedaddress", or "ipv6fixedaddress" when ipv6addr is set).
# See fixed-address-namespaced.yaml for the namespace-scoped variant used by
# namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI's AllocateIP call (the SDK's
# non-standard name for Create on this object type) returns an opaque `_ref`
# string from Create (e.g.
# "fixedaddress/ZG5zLmZpeGVkX2FkZHJlc3Mk...:10.0.0.50/default"); Crossplane
# stores it in the crossplane.io/external-name annotation. Do not set that
# annotation manually — the controller populates it. The `_ref` is UNSTABLE:
# changing ipv4addr/ipv6addr changes it.
#
# Required fields:
#   ipv4addr or ipv6addr: exactly one of the two must be set (mutually
#                          exclusive address families, enforced by a CRD
#                          validation rule). AllocateIP unconditionally
#                          requires a parent Network object covering the
#                          address (unlike HostRecord, which can bypass
#                          this via configureForDns) — network-prereq.yaml
#                          provisions that per-run parent Network ahead of
#                          this example (Makefile prerequisite-bundling,
#                          UPTEST_MANIFESTS_FIXED_ADDRESS).
#
# ${data.netFixedAddrHostCluster}: injected by uptest from the
# --data-source file (see test/e2e/gen-datasource.sh) so concurrent E2E
# runs against the shared NIOS Grid never request the same
# (networkView, network, ip, MAC) WAPI identity. Resolves to
# 100.64.<BLOCK_INDEX>.100 — a host address nested inside network-prereq.
# yaml's ${data.netFixedAddrParentCluster} /28 (see the sub-allocation map
# in gen-datasource.sh's header comment; fixed-address-namespaced.yaml
# uses the disjoint .112/28 parent and .120 host). Left literal
# ("${data.netFixedAddrHostCluster}") if no datasource is supplied, which
# is exactly the pre-isolation behavior this guards against.
#
# Create behavior: synchronous — the WAPI POST (AllocateIP) returns the
# `_ref` immediately; no async polling is needed.
#
# Optional but notable fields:
#   mac:         match key used only in MAC_ADDRESS matchClient mode (the
#                default when matchClient is left unset AND mac is a real,
#                non-zero address — see the trap below). WAPI requires mac
#                whenever both matchClient and mac are omitted — Create
#                fails with "MAC address is required when match_client is
#                undefined" (live-verified on the Grid). Setting
#                matchClient explicitly to any other mode (RESERVED,
#                CLIENT_ID, CIRCUIT_ID, REMOTE_ID) makes mac optional at
#                Create time, but changing matchClient away from
#                MAC_ADDRESS on an existing object clears whatever mac
#                value it already holds — see the crossplane.io/
#                update-test annotation below for why matchClient itself
#                is not update-tested.
#
#                Zero-MAC trap (live-verified on the Grid, WAPI 2.12): the
#                all-zero address "00:00:00:00:00:00" is NOT treated as a
#                literal MAC_ADDRESS match key — WAPI silently classifies
#                a fixed address created with that value as
#                matchClient=RESERVED instead, and RESERVED then silently
#                ignores every subsequent mac PUT (200 response, no
#                change, no error) with no re-entry path back to
#                MAC_ADDRESS short of also sending an explicit
#                matchClient=MAC_ADDRESS. This example therefore sets mac
#                to a real, non-zero placeholder address so Create lands
#                in MAC_ADDRESS mode. mac itself is not update-tested
#                (E2E isolation: it is part of the (networkView, network,
#                ip, MAC) natural key — see the crossplane.io/update-test
#                annotation below), but its create-time value still
#                selects MAC_ADDRESS mode and avoids the zero-MAC trap.
#   networkView: defaults to "default" when unset.
#
# No immutable fields are known for this resource — every Create parameter
# is also accepted by Update.
#
# Optional mutable fields: mac, networkView (only prior to first apply —
# see caveats above), name, matchClient, comment, extAttrs, disable,
# agentCircuitId, agentRemoteId, clientIdentifierPrependZero,
# dhcpClientIdentifier, options, useOptions.
apiVersion: fixedaddress.infobloxnios.crossplane.io/v1alpha1
kind: FixedAddress
metadata:
  name: example-fixed-address
  annotations:
    meta.upbound.io/example-id: fixedaddress/v1alpha1/fixedaddress
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
    # comment field below is a safe mutable scalar for update coverage;
    # field-level update testing runs through the post-assert hook wiring
    # and the crossplane.io/update-test annotation below.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-fixed-address.sh
    # comment, name, disable, and useOptions are the mutable scalars
    # exercised here (still enough to prove the update phase actually
    # runs on this resource, not just Create/Ready). ipv4addr/ipv6addr are
    # skipped: changing either changes the record's `_ref`, which NIOS
    # derives from the field values themselves, so the object identity
    # moves, and they are mutually exclusive. networkView is only
    # safely mutable prior to first apply (see the field doc above), so it
    # is not exercised post-create here. network only applies to dynamic
    # CIDR allocation, which this example does not use (it sets a literal
    # ipv4addr).
    #
    # mac is skipped rather than value-tested: mac is part of this
    # resource's (networkView, network, ip, MAC) natural key. ipv4addr is
    # now per-run tokenised (${data.netFixedAddrHostCluster}), but the
    # update-tester patches the RAW example file's literal value onto the
    # live resource, and two concurrent runs both patching mac to the same
    # literal converge that key's last component while networkView and
    # network stay literal on purpose so E2E runs share fixture context
    # rather than multiplying Grid state — an
    # unnecessary, avoidable narrowing of the isolation margin down to the
    # ip component alone. comment/disable/useOptions/name (see below)
    # already exercise the update phase for this resource without
    # reintroducing that risk.
    #
    # name is value-tested (not skipped): it does NOT participate in
    # FixedAddress's (networkView, network, ip, MAC) natural key — the
    # generated type doc confirms it is purely a "Display name of the
    # fixed address", compared only for spec-vs-observed drift
    # (isUpToDateAddress), never used to resolve or disambiguate the WAPI
    # object. Two concurrent runs converging on the same literal name
    # value is therefore safe.
    #
    # matchClient is skipped rather than value-tested: this example sets a
    # real, non-zero mac (see the zero-MAC trap in the field doc above),
    # so Create lands in matchClient=MAC_ADDRESS and that value is
    # late-initialized into spec (see the FixedAddress controller's
    # lateInitializeIdentityMeta). Live-verified on the Grid (WAPI 2.12):
    # every non-MAC_ADDRESS value (RESERVED, CLIENT_ID, CIRCUIT_ID)
    # clears the mac field as a side effect of the mode switch — the
    # field disappears from a GET that explicitly requests it. mac itself
    # is skipped above (natural-key collision risk under concurrent E2E
    # runs), but the create-time mac value still selects MAC_ADDRESS mode,
    # and any real matchClient transition away from it would clobber that
    # value out from under the resource regardless. There is no
    # matchClient value that both differs from MAC_ADDRESS and leaves mac
    # untouched, so the field is skipped here rather than accepting a
    # known, unavoidable side effect on every run.
    # agentCircuitId/agentRemoteId/dhcpClientIdentifier/
    # clientIdentifierPrependZero are only relevant to the CIRCUIT_ID/
    # REMOTE_ID/CLIENT_ID matchClient modes, which are never entered by
    # this example for the same reason. extAttrs and options are
    # map/list fields skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: mac
        skip: "mac is part of this resource's (networkView, network, ip, MAC) natural key; networkView and network stay literal on purpose so E2E runs share fixture context rather than multiplying Grid state, and ipv4addr is per-run tokenised, so patching mac to a shared literal across concurrent runs would needlessly narrow the isolation margin down to the ip component alone — comment/disable/useOptions/name already exercise the update phase for this resource"
      - field: name
        value: "updated-fixed-address"
      - field: matchClient
        skip: "this example sets a real, non-zero mac so Create lands in matchClient=MAC_ADDRESS (the all-zero mac is a Grid trap that silently produces matchClient=RESERVED instead — see the mac field doc above); live-verified on the Grid that every other match_client value clears the mac field as a side effect regardless — no value both differs from MAC_ADDRESS and leaves mac untouched"
      - field: disable
        value: true
      - field: useOptions
        value: true
      - field: ipv4addr
        skip: "changing it changes the record's _ref, which NIOS derives from the field values themselves, so the object identity moves; mutually exclusive with ipv6addr"
      - field: ipv6addr
        skip: "changing it changes the record's _ref, which NIOS derives from the field values themselves, so the object identity moves; mutually exclusive with ipv4addr"
      - field: networkView
        skip: "only safely mutable prior to first apply per the field documentation; not exercised post-create"
      - field: network
        skip: "only meaningful for dynamic CIDR allocation; this example uses a literal ipv4addr"
      - field: agentCircuitId
        skip: "only relevant when matchClient=CIRCUIT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: agentRemoteId
        skip: "only relevant when matchClient=REMOTE_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: dhcpClientIdentifier
        skip: "only relevant when matchClient=CLIENT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: clientIdentifierPrependZero
        skip: "only relevant alongside dhcpClientIdentifier/CLIENT_ID, a mode this example never enters (see the matchClient skip rationale above)"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target"
spec:
  forProvider:
    ipv4addr: ${data.netFixedAddrHostCluster}
    mac: "00:00:00:00:0a:01"
    networkView: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
