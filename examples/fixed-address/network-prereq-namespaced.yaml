# network-prereq-namespaced.yaml — namespace-scoped variant of the
# prerequisite parent Network for fixed-address-namespaced.yaml. See
# network-prereq.yaml for the full rationale — this file only documents
# what differs.
#
# Distinct identity: ${data.netFixedAddrParentNamespaced} is a disjoint
# sub-block from network-prereq.yaml's ${data.netFixedAddrParentCluster}
# (see test/e2e/gen-datasource.sh's sub-allocation map) so both scopes'
# prerequisites — and both scopes' fixed-address hosts nested inside them
# — can apply in the same E2E run without colliding.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
apiVersion: network.infobloxnios.m.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-fixed-address-network-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
spec:
  forProvider:
    networkView: default
    network: ${data.netFixedAddrParentNamespaced}
    comment: "Prerequisite parent network for fixed-address-namespaced.yaml (E2E isolation)"
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
