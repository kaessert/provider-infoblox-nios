# HostRecord is the namespace-scoped variant of the Infoblox NIOS host
# record. See host-record.yaml for the cluster-scoped variant and full
# field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the host name below differs from host-record.yaml's
# so both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, name) WAPI identity.
apiVersion: hostrecord.infobloxnios.m.crossplane.io/v1alpha1
kind: HostRecord
metadata:
  name: example-hostrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: hostrecord/v1alpha1/hostrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # host-record.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-host-record-namespaced.sh
    # Per-field update coverage — see host-record.yaml for the rationale
    # behind each skip entry and the useTtl-before-ttl ordering.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: disable
        value: true
      - field: name
        skip: "_ref-mutating identity field for HostRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on host-record.yaml's view field instead"
      - field: view
        skip: "_ref-mutating identity field for HostRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on host-record.yaml's view field instead"
      - field: configureForDns
        skip: "toggling DNS registration can remove the record from DNS entirely, altering derived zone/dnsName atProvider fields"
      - field: ipv4Addrs
        skip: "list field — not a scalar update target"
      - field: ipv6Addrs
        skip: "list field — not a scalar update target"
      - field: aliases
        skip: "list field — not a scalar update target"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: networkViewRef
        skip: "reference field resolving to networkView, which is immutable after creation"
      - field: networkViewSelector
        skip: "reference field resolving to networkView, which is immutable after creation"
      - field: ipv4Cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update; mutually exclusive with static ipv4Addrs entries"
      - field: ipv6Cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update; mutually exclusive with static ipv6Addrs entries"
      - field: filterParams
        skip: "EA-based IP allocation filter, mutually exclusive with ipv4Cidr/ipv6Cidr; not used by this example's static-address allocation"
      - field: ipAddressType
        skip: "only required/applicable when filterParams is set; not used by this example's static-address allocation"
spec:
  forProvider:
    name: test-host-ns.example.com
    ipv4Addrs:
      - ipv4Addr: 10.0.0.101
    view: default
    # configureForDns must be true — see host-record.yaml for the
    # rationale (WAPI rejects Create with enable_dns=false unless the
    # host address belongs to an existing IPAM Network, which this E2E
    # environment does not provision).
    configureForDns: true
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
