# HostRecord is a cluster-scoped Infoblox NIOS host record (WAPI object
# type "record:host"). See host-record-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:host/ZG5zLmhvc3Rfcm9v:test-host.example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Required fields:
#   name:      host name in FQDN format. Renaming changes the record's
#              `_ref` (the controller re-syncs the external-name
#              annotation when that happens).
#   ipv4Addrs: at least one IPv4 address entry is required on create.
#
# Optional but notable fields:
#   networkView: immutable after creation — the underlying SDK's update
#                call has no networkView parameter.
#   view:        mutable — changing it moves the record between DNS
#                views and changes the `_ref`.
#
# Optional mutable fields: aliases, comment, disable, ttl, useTtl,
# configureForDns, extAttrs.
#
# Identity is BOTH name and address — correcting an earlier classification
# of this resource as purely named. The controller's
# hostRecordExistsByNaturalKey searches on (networkView, view, name,
# ipv4Addr, ipv6Addr) together, so two concurrent E2E runs must not share
# either the name OR the address, or they can converge on the same live
# record even with the other half of the tuple distinct.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent runs never request the same
# name. Left literal ("${data.runToken}") if no datasource is supplied,
# which is exactly the pre-isolation behavior this guards against.
#
# ${data.netHostRecordCluster}: this scope's fixed single-address offset
# inside the run's netPrefix block (100.64.<BLOCK_INDEX>.128 — see the
# sub-allocation map in gen-datasource.sh's header comment;
# host-record-namespaced.yaml uses the disjoint .129 offset). HostRecord
# does not need a prerequisite parent Network object the way FixedAddress
# and Range do (see configureForDns below), so no network-prereq.yaml
# exists for this resource.
apiVersion: hostrecord.infobloxnios.crossplane.io/v1alpha1
kind: HostRecord
metadata:
  name: example-hostrecord
  annotations:
    meta.upbound.io/example-id: hostrecord/v1alpha1/hostrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
    # comment field below is a safe mutable scalar for update coverage;
    # field-level update testing runs via the hook annotation just below.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-host-record.sh
    # Per-field update coverage for the post-assert hook. Scalar mutable
    # fields are exercised with a real value change; list/map fields are
    # skipped with a reason so the validate subcommand still reports full
    # coverage. useTtl is tested BEFORE ttl: WAPI ignores a submitted ttl
    # value on record:host until use_ttl is true, so testing ttl first
    # would poll for a value the server has not applied yet and can time
    # out waiting for it.
    #
    # view is one of HostRecord's two identity-composing fields (the
    # other is name) — live-verified by base64-decoding a record:host
    # _ref ("dns.host$.<view>.<reversed-zone>.<name>"): moving default ->
    # Internal changes the _ref and the previous ref 404s immediately.
    # It is exercised here with a real value change (rather than skipped)
    # to prove the refreshed external-name annotation persists across the
    # rotation end-to-end, mirroring record-srv's priority field. name
    # stays skipped below — asserting its post-rotation value would just
    # repeat the same rotation flow view already proves.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: disable
        value: true
      - field: name
        skip: "_ref-mutating identity field for HostRecord; renaming would require predicting the rotated external-name ref ahead of time to assert it — the view field below already exercises _ref rotation end-to-end for this resource"
      - field: view
        value: "Internal"
      - field: configureForDns
        skip: "toggling DNS registration can remove the record from DNS entirely, altering derived zone/dnsName atProvider fields"
      - field: ipv4Addrs
        skip: "list field — not a scalar update target"
      - field: ipv6Addrs
        skip: "list field — not a scalar update target"
      - field: aliases
        skip: "list field — not a scalar update target"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: networkViewRef
        skip: "reference field resolving to networkView, which is immutable after creation"
      - field: networkViewSelector
        skip: "reference field resolving to networkView, which is immutable after creation"
      - field: ipv4Cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update; mutually exclusive with static ipv4Addrs entries"
      - field: ipv6Cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update; mutually exclusive with static ipv6Addrs entries"
      - field: filterParams
        skip: "EA-based IP allocation filter, mutually exclusive with ipv4Cidr/ipv6Cidr; not used by this example's static-address allocation"
      - field: ipAddressType
        skip: "only required/applicable when filterParams is set; not used by this example's static-address allocation"
spec:
  forProvider:
    name: test-host-${data.runToken}.example.com
    ipv4Addrs:
      - ipv4Addr: ${data.netHostRecordCluster}
    view: default
    # configureForDns must be true: the WAPI Grid Manager rejects Create
    # when DNS is not configured (enable_dns=false) unless the host
    # address already belongs to an existing IPAM Network object, which
    # the E2E environment does not provision. test/setup.sh creates the
    # example.com auth zone specifically so this record can register as
    # a DNS host under it — omitting this field defaults to false (see
    # controller.go's boolOrFalse helper) and fails Create with
    # IB.Data.Conflict: "At least one host address must belong to an
    # existing network if DNS is not configured for this host." This
    # reasoning is unaffected by ${data.netHostRecordCluster} being a
    # 100.64.0.0/16 address rather than a fixed literal — DNS
    # registration is keyed on the example.com zone, not on the address's
    # network membership.
    configureForDns: true
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
