# IPv4SharedNetwork is the namespace-scoped variant of the Infoblox NIOS
# shared network. See ipv4-shared-network.yaml for the cluster-scoped
# variant and full field documentation — this file only documents what
# differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the name and CIDR below both derive from a run-scoped
# token/offset disjoint from ipv4-shared-network.yaml's, so both examples
# can be applied to the same NIOS Grid Manager at once without colliding
# on the same shared-network name or member-network CIDR. See
# ipv4-shared-network.yaml for the full identity and member-network
# rationale.
apiVersion: ipv4sharednetwork.infobloxnios.m.crossplane.io/v1alpha1
kind: IPv4SharedNetwork
metadata:
  name: example-ipv4-shared-network-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: ipv4sharednetwork/v1alpha1/ipv4sharednetwork
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # ipv4-shared-network.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-ipv4-shared-network-namespaced.sh
    # See ipv4-shared-network.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: disable
        value: true
      - field: useOptions
        value: true
      - field: name
        skip: "the WAPI _ref for a shared network embeds its name; renaming rotates the _ref, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: networks
        skip: "cidr-match cross-resource reference list, not a scalar update-test target"
      - field: networksRefs
        skip: "cidr-match cross-resource reference list, not a scalar update-test target"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: example-shared-network-ns-${data.runToken}
    networks:
      - ${data.netSharedMemberNamespaced}
    networkView: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
