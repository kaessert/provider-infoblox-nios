# NetworkContainer is a cluster-scoped Infoblox NIOS network container (WAPI
# object type networkcontainer). A network container reserves a CIDR block
# from which child networks and ranges can later be carved. See
# network-container-namespaced.yaml for the namespace-scoped variant used by
# namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Required fields:
#   networkView: the NetworkView the container belongs to, by name. Fixed at
#                creation — absent from the UpdateNetworkContainer SDK
#                method signature. This is a cross-resource reference
#                (networkViewRef/networkViewSelector are also available);
#                this example uses the Grid's well-known "default" network
#                view (inline value) so it runs standalone without creating
#                a NetworkView resource first. To reference a
#                Crossplane-managed NetworkView instead, set
#                networkViewRef.name to the NetworkView's metadata.name —
#                see examples/network-view/network-view.yaml.
#   network:     CIDR of the container, e.g. "172.25.0.0/16". Fixed at
#                creation. This example uses a TEST-NET style address —
#                replace with a real CIDR for a live NIOS Grid Manager.
#
# Optional mutable fields: comment, extAttrs.
apiVersion: networkcontainer.infobloxnios.crossplane.io/v1alpha1
kind: NetworkContainer
metadata:
  name: example-network-container
  annotations:
    meta.upbound.io/example-id: networkcontainer/v1alpha1/networkcontainer
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-container.sh
    # comment is the only mutable scalar exercised here — extAttrs is also
    # mutable but comment alone is sufficient update coverage.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
spec:
  forProvider:
    networkView: default
    network: 172.25.0.0/16
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
