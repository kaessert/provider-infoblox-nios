# Network (IPv6) is a cluster-scoped Infoblox NIOS network whose CIDR
# selects the WAPI object type "ipv6network" rather than "network" — see
# network.yaml for the IPv4 sibling example and full field documentation.
# This file exists specifically to stand a live gate over the
# dual-object-type hazard documented on Network's controller: WAPI models
# IPv4 and IPv6 networks as different object types behind the SAME Go SDK
# struct (ibclient.Network), selected at runtime from the CIDR's address
# family. If the identity search that Observe/Delete issue is ever pointed
# at the wrong object type, it returns zero matches, Observe reports the
# resource absent, and the reconciler creates a DUPLICATE — silently, with
# the MR still reporting Ready=True. See network-namespaced.yaml for the
# namespace-scoped variant.
#
# The assertion that makes this example meaningful: the post-assert hook
# (crossplane.io/expect-external-name-prefix below) checks that the
# resolved crossplane.io/external-name annotation is prefixed
# "ipv6network/", not merely that the resource reaches Ready. A resource
# that was silently created against the wrong object type would still
# reach Ready — only the external-name prefix reveals it.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "ipv6network/ZG5z...:2001:db8:9f88::/64/default") from Create;
# Crossplane stores it in the crossplane.io/external-name annotation. Do
# not set that annotation manually — the controller populates it.
#
# CIDR choice: 2001:db8::/32 is the IPv6 documentation range (RFC 3849),
# already used elsewhere in this catalog for illustrative values (see
# record-aaaa.yaml). Unlike the IPv4 examples in this catalog, this
# network's identity is NOT tokenised with ${data.runToken}: the /32
# documentation block leaves an address space of 2^32 distinct /64s, so an
# untokenised sub-prefix carries a collision probability with a concurrent
# run that is negligible by comparison to the IPv4 RFC 6598 pool (a bounded
# 256 /24 blocks — see test/e2e/gen-datasource.sh) — and no other example
# in this catalog creates an IPv6 Network object that could collide on the
# same sub-prefix. Distinct identity: the CIDR below differs from
# network-v6-namespaced.yaml's so both examples can be applied to the same
# NIOS Grid Manager at once without colliding on the same (network_view,
# network) WAPI identity — the same pattern network.yaml/
# network-namespaced.yaml use for their IPv4 CIDRs.
#
# Required fields:
#   networkView: the NetworkView the network belongs to, by name. Fixed at
#                creation — absent from the UpdateNetwork SDK method
#                signature. This example uses the Grid's well-known
#                "default" network view (inline value) so it runs
#                standalone without creating a NetworkView resource first.
#   network:     CIDR of the network. An IPv6 CIDR here (as opposed to
#                network.yaml's IPv4 CIDR) is what selects "ipv6network"
#                as the WAPI object type at runtime — see isIPv6CIDR in
#                the controller.
#
# Optional mutable fields: comment, extAttrs.
apiVersion: network.infobloxnios.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-network-v6
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network-v6
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-v6.sh
    # The dual-object-type identity guard — see the file header. The
    # generic post-assert hook (test/hooks/run-update-tester.sh) reads
    # this annotation and, when present, runs
    # `update-tester check-external-name-prefix` right after Create,
    # before the per-field update tests below.
    crossplane.io/expect-external-name-prefix: "ipv6network/"
    # comment is the only mutable scalar exercised here — see network.yaml
    # for the rationale behind the other skips (all identical here; the
    # dual-object-type behavior does not change which fields are mutable).
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: parentCidr
        skip: "create-time-only allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: allocatePrefixLen
        skip: "only required when parentCidr or filterParams is set; not used by this example's static CIDR"
      - field: filterParams
        skip: "create-time-only EA-based allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: object
        skip: "only valid when filterParams is set; not used by this example's static CIDR"
spec:
  forProvider:
    networkView: default
    network: 2001:db8:9f88::/64
    comment: Managed by Crossplane (IPv6)
  providerConfigRef:
    name: default
