# NetworkView is the namespace-scoped variant of the Infoblox NIOS network
# view. See network-view.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the name below differs from network-view.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same network view name.
apiVersion: networkview.infobloxnios.m.crossplane.io/v1alpha1
kind: NetworkView
metadata:
  name: example-network-view-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: infobloxnios/v1alpha1/networkview
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # network-view.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-view-namespaced.sh
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
spec:
  forProvider:
    name: "test-network-view-ns"
    comment: "Test namespaced network view created by Crossplane"
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
