# network-allocate-parent.yaml — prerequisite parent NetworkContainer for
# network-allocate.yaml. Demonstrates the "dynamic CIDR allocation" family:
# a Network can be created without a static spec.forProvider.network CIDR,
# instead supplying filterParams (an extensible-attribute search) so the
# controller resolves a covering parent object and allocates a subnet from
# it via WAPI's AllocateNetworkByEA call. That behavior needs a real parent
# object carrying a matching extensible attribute to allocate from — this
# manifest is that parent. Apply this file before network-allocate.yaml.
#
# Documentation-only example — see network-allocate.yaml for why this pair
# is NOT wired into `make e2e`.
#
# External name: server-assigned, same as network-container.yaml (this is
# a WAPI networkcontainer object, not a distinct resource type).
#
# network: 172.27.0.0/16 — chosen to not collide with any other example's
# hardcoded CIDR in this repo (network.yaml: 198.51.100.0/24,
# network-namespaced.yaml: 198.51.101.0/24, network-container.yaml:
# 172.25.0.0/16, network-container-namespaced.yaml: 172.26.0.0/16). Not
# reserved on any real Grid — re-check for collisions before reuse.
#
# extAttrs.Site: the search key network-allocate.yaml's filterParams
# matches on. The "Site" extensible attribute definition already exists as
# a common default on NIOS Grid Manager (confirmed via
# GET /wapi/v2.12/extensibleattributedef during manifest verification) —
# no ExtensibleAttributeDef resource is required as a prerequisite.
apiVersion: networkcontainer.infobloxnios.crossplane.io/v1alpha1
kind: NetworkContainer
metadata:
  name: example-network-allocate-parent
  annotations:
    meta.upbound.io/example-id: networkcontainer/v1alpha1/networkcontainer
spec:
  forProvider:
    networkView: default
    network: 172.27.0.0/16
    extAttrs:
      Site: network-allocate-demo
    comment: Prerequisite parent for network-allocate.yaml (EA-based dynamic allocation demo)
  providerConfigRef:
    name: default
