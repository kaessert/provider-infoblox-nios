# network-allocate.yaml — Network created via the EA-based dynamic
# allocation path: filterParams + allocatePrefixLen + object, instead of a
# static spec.forProvider.network CIDR. Makefile prerequisite-bundling
# (UPTEST_MANIFESTS_NETWORK_ALLOCATE) applies network-allocate-parent.yaml
# first — the controller resolves filterParams to that parent object
# (matched by its extAttrs.Site value) via WAPI's AllocateNetworkByEA
# call, allocates a free /allocatePrefixLen block from it, and
# late-initializes spec.forProvider.network with the result. See
# network.yaml for the static-CIDR path and full documentation of every
# other field — this file only documents what's specific to the allocate
# path.
#
# filterParams keys MUST carry the WAPI extensible-attribute search prefix
# "*" — "*Site", not "Site". A bare key is rejected by WAPI with
# `{"Error": "AdmConProtoError: Unknown argument/field: 'Site'", "code":
# "Client.Ibap.Proto"}` (verified live against a NIOS Grid Manager). This
# pair of manifests exists because filterParams had zero example coverage
# anywhere in this repo before it, and the prefix requirement is easy to
# get wrong.
#
# parentCidr-based allocation (the other create-time-only allocation input
# on Network, alongside filterParams) remains unexercised by any example —
# out of scope for this manifest, which documents only the EA-based path.
#
# ${data.runToken}: matches network-allocate-parent.yaml's
# extAttrs.Site value. filterParams is a Grid-wide extensible-attribute
# search — it matches ANY object carrying the value, not just this run's
# parent — so both sides use the same per-run token instead of a fixed
# literal to keep the search scoped to exactly this run's parent even
# while other runs' parents exist concurrently on the shared Grid.
#
# Live-verified end-to-end through the controller (not just a raw WAPI
# probe) with a /25 parent and matching Site value: reached Ready/Synced
# in ~25s, allocated a /28 child CIDR from the parent, external-name
# "network/<opaque-b64-ref>:<allocated-cidr>/default", and
# late-initialized spec.forProvider.network to the allocated CIDR.
apiVersion: network.infobloxnios.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-network-allocate
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-allocate.sh
    # comment is the only mutable scalar exercised here — same rationale
    # as network.yaml. networkView, filterParams, allocatePrefixLen, and
    # object are all create-time-only allocation inputs (drive
    # AllocateNetworkByEA at Create) and are not safely re-postable after
    # the resource is already Ready. network itself is late-initialized
    # from the allocation result, not a user-set field, so it is not
    # update-tested either.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: networkView
        skip: "fixed at creation — absent from the UpdateNetwork SDK method signature"
      - field: network
        skip: "late-initialized from the AllocateNetworkByEA result, not a user-set field on this example"
      - field: parentCidr
        skip: "create-time-only allocation input, mutually exclusive with filterParams"
      - field: allocatePrefixLen
        skip: "create-time-only allocation input consumed by AllocateNetworkByEA at Create"
      - field: filterParams
        skip: "create-time-only EA-based allocation input consumed by AllocateNetworkByEA at Create"
      - field: object
        skip: "only valid when filterParams is set; identifies the parent object type consumed at Create"
spec:
  forProvider:
    networkView: default
    filterParams:
      "*Site": ${data.runToken}
    allocatePrefixLen: 28
    object: networkcontainer
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
