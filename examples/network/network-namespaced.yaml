# Network is the namespace-scoped variant of the Infoblox NIOS network.
# See network.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: ${data.netNetworkNamespaced} is a different, disjoint
# sub-block of the same per-run address space as network.yaml's
# ${data.netNetworkCluster} (see test/e2e/gen-datasource.sh's sub-allocation
# map) so both examples can be applied to the same NIOS Grid Manager at once
# — even within the SAME E2E run — without colliding on the same
# (network_view, network) WAPI identity.
apiVersion: network.infobloxnios.m.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-network-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # network.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-namespaced.sh
    # See network.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: parentCidr
        skip: "create-time-only allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: allocatePrefixLen
        skip: "only required when parentCidr or filterParams is set; not used by this example's static CIDR"
      - field: filterParams
        skip: "create-time-only EA-based allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: object
        skip: "only valid when filterParams is set; not used by this example's static CIDR"
spec:
  forProvider:
    networkView: default
    network: ${data.netNetworkNamespaced}
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
