# Network (IPv6 variant) is the namespace-scoped variant of the Infoblox
# NIOS IPv6 network. See network-v6.yaml for the cluster-scoped variant and
# the dual-object-type rationale, and network-namespaced.yaml for the
# IPv4 namespace-scoped variant — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: ${data.netV6NetworkNamespaced} is a different,
# disjoint per-run IPv6 block from ${data.netV6NetworkCluster} (see
# test/e2e/gen-datasource.sh's sub-allocation map) so both examples can be
# applied to the same NIOS Grid Manager at once without colliding on the
# same (network_view, network) WAPI identity.
apiVersion: network.infobloxnios.m.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-network-v6-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # network.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-network-v6-namespaced.sh
    # See network-v6.yaml for the dual-object-type guard rationale.
    crossplane.io/expect-external-name-prefix: "ipv6network/"
    # See network-v6.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (IPv6, namespaced)"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: parentCidr
        skip: "create-time-only allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: allocatePrefixLen
        skip: "only required when parentCidr or filterParams is set; not used by this example's static CIDR"
      - field: filterParams
        skip: "create-time-only EA-based allocation input, mutually exclusive with the static network CIDR this example uses"
      - field: object
        skip: "only valid when filterParams is set; not used by this example's static CIDR"
spec:
  forProvider:
    networkView: default
    network: ${data.netV6NetworkNamespaced}
    comment: Managed by Crossplane (IPv6, namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
