# Network is a cluster-scoped Infoblox NIOS network (WAPI object type
# network, or ipv6network for an IPv6 CIDR). See network-namespaced.yaml
# for the namespace-scoped variant used by namespaced (ModernManaged)
# resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# from Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Required fields:
#   networkView: the NetworkView the network belongs to, by name. Fixed at
#                creation — absent from the UpdateNetwork SDK method
#                signature. This example uses the Grid's well-known
#                "default" network view (inline value) so it runs
#                standalone without creating a NetworkView resource first.
#   network:     CIDR of the network, e.g. "10.0.0.0/24" (IPv4) or an IPv6
#                CIDR. Fixed at creation — the WAPI object type (network vs
#                ipv6network) is selected at runtime from this value's
#                format. This example uses a TEST-NET-2 address (RFC 5737)
#                — replace with a real CIDR for a live NIOS Grid Manager.
#
# Optional mutable fields: comment, extAttrs.
apiVersion: network.infobloxnios.crossplane.io/v1alpha1
kind: Network
metadata:
  name: example-network
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
    # comment field below is a safe mutable scalar for update coverage;
    # field-level update testing is wired via post-assert-hook during the
    # E2E ticket.
spec:
  forProvider:
    networkView: default
    network: 198.51.100.0/24
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
