# Secret containing Infoblox NIOS Grid Manager credentials.
#
# Required keys (read directly from the Secret's data by the provider's
# credential bridge — the "key" field below is required by the
# ProviderConfig CRD schema but is NOT used to select a single value):
#   username: WAPI username
#   password: WAPI password
#
# The Grid Manager hostname/IP is NOT a Secret key — it is spec.host on the
# ProviderConfig / ClusterProviderConfig below, since it is a non-secret
# connection parameter. TLS certificate verification is likewise controlled
# by spec.sslVerify on the ProviderConfig / ClusterProviderConfig, not by a
# Secret key.
#
# To create from the E2E credential env vars (INFOBLOX_USER, INFOBLOX_PASS):
#   kubectl -n crossplane-system create secret generic infobloxnios-credentials \
#     --from-literal=username="${INFOBLOX_USER}" \
#     --from-literal=password="${INFOBLOX_PASS}"
apiVersion: v1
kind: Secret
metadata:
  namespace: crossplane-system
  name: infobloxnios-credentials
type: Opaque
stringData:
  username: "admin"
  password: "change-me"
---
# ProviderConfig — cluster-scoped. Used by cluster-scoped managed resources,
# e.g. examples/record-a/record-a.yaml.
apiVersion: infobloxnios.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Host is the NIOS Grid Manager hostname or IP address.
  host: "gm.example.com"
  # sslVerify: set to false only when the Grid Manager presents a
  # self-signed certificate whose SAN does not match the reachable host
  # address. Defaults to true (verify) when omitted.
  sslVerify: true
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: infobloxnios-credentials
      # Unused by the credential bridge (which reads username/password
      # directly from the Secret's data) but required by the CRD schema.
      key: password
---
# ProviderConfig — namespace-scoped. Used by namespaced managed resources in
# the same namespace as this ProviderConfig.
apiVersion: infobloxnios.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  # Host is the NIOS Grid Manager hostname or IP address.
  host: "gm.example.com"
  # sslVerify: set to false only when the Grid Manager presents a
  # self-signed certificate whose SAN does not match the reachable host
  # address. Defaults to true (verify) when omitted.
  sslVerify: true
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: infobloxnios-credentials
      key: password
---
# ClusterProviderConfig — cluster-scoped. Used by namespaced managed
# resources from any namespace, e.g. examples/record-a/record-a-namespaced.yaml.
apiVersion: infobloxnios.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  # Host is the NIOS Grid Manager hostname or IP address.
  host: "gm.example.com"
  # sslVerify: set to false only when the Grid Manager presents a
  # self-signed certificate whose SAN does not match the reachable host
  # address. Defaults to true (verify) when omitted.
  sslVerify: true
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: infobloxnios-credentials
      key: password
