# Example ProviderConfig enabling the Infoblox gridmaster read/write split.
#
# Read traffic (Observe) is routed to the gridmaster *candidate* (read_server)
# and write traffic (Create/Update/Delete) to the *primary* gridmaster
# (server), mirroring native tooling that uses read_url + write_url.
#
# The split is opt-in and backward compatible: omit read_server (or set it to
# the same host as server) and behavior is identical to a single-endpoint
# ProviderConfig.
#
# See docs/read-write-split.md for the replication-lag caveat and tuning notes.
apiVersion: infoblox-nios.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      name: example-creds
      namespace: crossplane-system
      key: credentials
---
# Credentials secret. The value under .data.credentials is base64 of the JSON
# shown below (rendered here via stringData for readability). Only "server" is
# required; "read_server" opts into the split. The read_* overrides each fall
# back to their write counterpart when omitted, so typically you only set
# read_server.
apiVersion: v1
kind: Secret
metadata:
  name: example-creds
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "server": "gm-primary.infoblox.example.com",
      "read_server": "gm-candidate.infoblox.example.com",
      "username": "admin",
      "password": "REDACTED",
      "sslmode": "false",
      "port": "443",
      "connection_timeout": "60",
      "pool_connections": "10",
      "wapi_version": "2.12",

      "//read_port": "optional: defaults to port",
      "//read_sslmode": "optional: defaults to sslmode",
      "//read_wapi_version": "optional: defaults to wapi_version"
    }
