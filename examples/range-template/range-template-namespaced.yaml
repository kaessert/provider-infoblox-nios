# RangeTemplate is the namespace-scoped variant of the Infoblox NIOS DHCP
# range template. See range-template.yaml for the cluster-scoped variant and
# full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the name below differs from range-template.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once without
# colliding on the same range template name.
apiVersion: rangetemplate.infobloxnios.m.crossplane.io/v1alpha1
kind: RangeTemplate
metadata:
  name: example-range-template-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: rangetemplate/v1alpha1/rangetemplate
    uptest.upbound.io/timeout: "120"
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-range-template-namespaced.sh
    # See range-template.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: numberOfAddresses
        value: 30
      - field: offset
        value: 60
      - field: useOptions
        value: true
      - field: cloudApiCompatible
        value: true
      - field: name
        skip: "renaming a range template can change the WAPI _ref (like ARecord); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: serverAssociationType
        skip: "requires a specific, mutually-consistent Grid association (member/failover) not modeled by this standalone example"
      - field: failoverAssociation
        skip: "only meaningful when serverAssociationType=FAILOVER, referencing a pre-existing Grid failover association not modeled by this example"
      - field: member
        skip: "only meaningful when serverAssociationType=MEMBER; not a scalar update-test target"
      - field: msServer
        skip: "write-only convenience parameter, never mirrored into the observed state"
      - field: extattrs
        skip: "optional map field, low update-test value"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target"
spec:
  forProvider:
    name: example-range-template-ns
    numberOfAddresses: 20
    offset: 50
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
