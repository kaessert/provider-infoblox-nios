# RangeTemplate is a cluster-scoped Infoblox NIOS DHCP range template (WAPI
# object type rangetemplate). See range-template-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string from
# Create (e.g. "rangetemplate/ZG5zLnJhbmdl...:my-range-template"); Crossplane
# stores it in the crossplane.io/external-name annotation. Do not set that
# annotation manually — the controller populates it.
#
# Required fields:
#   name:              name of the range template object. Mutable (unlike
#                       server-assigned resources whose identity fields are
#                       immutable, RangeTemplate's Update call accepts every
#                       Create parameter, including name).
#   numberOfAddresses: number of addresses the range should contain when a
#                       Range is instantiated from this template.
#   offset:             start address offset within the parent network when
#                       instantiated.
#
# Optional mutable fields: comment, extAttrs, options, useOptions,
# serverAssociationType, failoverAssociation, member, cloudApiCompatible,
# msServer. No immutable fields are known for this resource — every Create
# parameter is also accepted by Update.
#
# uptest.upbound.io/update-parameter is intentionally omitted — it has
# known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
# comment field below is a safe mutable scalar for update coverage;
# field-level update testing runs through the post-assert hook wiring and
# the crossplane.io/update-test annotation below.
apiVersion: rangetemplate.infobloxnios.crossplane.io/v1alpha1
kind: RangeTemplate
metadata:
  name: example-range-template
  annotations:
    meta.upbound.io/example-id: rangetemplate/v1alpha1/rangetemplate
    uptest.upbound.io/timeout: "120"
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-range-template.sh
    # comment, numberOfAddresses, offset, useOptions, and
    # cloudApiCompatible are the mutable scalars exercised here. name is
    # also mutable (RangeTemplate's Update call accepts every Create
    # parameter, including name), but renaming can change the WAPI
    # `_ref` (like ARecord); that rotation is already exercised by
    # controller unit tests, so it is skipped here. serverAssociationType
    # and its dependents (failoverAssociation, member) require a
    # specific, mutually-consistent combination of Grid objects
    # (an existing failover association or Grid member) not modeled by
    # this standalone example, so they are skipped. msServer is a
    # write-only convenience parameter never mirrored into the observed
    # state. extAttrs and options are map/list fields skipped for low
    # update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: numberOfAddresses
        value: 20
      - field: offset
        value: 20
      - field: useOptions
        value: true
      - field: cloudApiCompatible
        value: true
      - field: name
        skip: "renaming a range template can change the WAPI _ref (like ARecord); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: serverAssociationType
        skip: "requires a specific, mutually-consistent Grid association (member/failover) not modeled by this standalone example"
      - field: failoverAssociation
        skip: "only meaningful when serverAssociationType=FAILOVER, referencing a pre-existing Grid failover association not modeled by this example"
      - field: member
        skip: "only meaningful when serverAssociationType=MEMBER; not a scalar update-test target"
      - field: msServer
        skip: "write-only convenience parameter, never mirrored into the observed state"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: options
        skip: "list field of DHCP option structs, not a scalar update-test target"
spec:
  forProvider:
    name: example-range-template
    numberOfAddresses: 10
    offset: 10
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
