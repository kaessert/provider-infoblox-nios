# Range is the namespace-scoped variant of the Infoblox NIOS DHCP address
# range. See range.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the address range below differs from range.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same range identity.
apiVersion: range.infobloxnios.m.crossplane.io/v1alpha1
kind: Range
metadata:
  name: example-range-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: range/v1alpha1/range
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # range.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-range-namespaced.sh
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: startAddr
        skip: "changing the range's addresses alters its live identity — not exercised via per-field diff testing"
      - field: endAddr
        skip: "changing the range's addresses alters its live identity — not exercised via per-field diff testing"
      - field: networkView
        skip: "changing the owning network view alters the range's live identity — not exercised via per-field diff testing"
      - field: network
        skip: "optional field intentionally omitted from this example (no pre-provisioned Network object in the E2E environment)"
      - field: template
        skip: "create-only parameter — UpdateNetworkRange does not accept it"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: networkViewRef
        skip: "reference field resolving to networkView; not exercised via per-field diff testing"
      - field: networkViewSelector
        skip: "reference field resolving to networkView; not exercised via per-field diff testing"
spec:
  forProvider:
    startAddr: 203.0.113.160
    endAddr: 203.0.113.180
    networkView: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
