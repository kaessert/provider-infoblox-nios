# Range is a cluster-scoped Infoblox NIOS DHCP address range (WAPI object
# type range) — a contiguous block of addresses within a network that DHCP
# can lease out. See range-namespaced.yaml for the namespace-scoped variant
# used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout would be
# sufficient; this example sets a slightly longer timeout as a margin for
# a busy Grid Manager.
#
# Required fields:
#   startAddr: first address in the DHCP range.
#   endAddr:   last address in the DHCP range.
#
# ${data.netRangeStartCluster} / ${data.netRangeEndCluster}: injected by
# uptest from the --data-source file (see test/e2e/gen-datasource.sh) so
# concurrent E2E runs against the shared NIOS Grid never request the same
# (startAddr, endAddr, networkView) WAPI identity. These resolve to
# 100.64.<BLOCK_INDEX>.140 through .160 — the cluster-scope's fixed
# 21-address sub-block reserved inside the run's /24 (see the
# sub-allocation map in gen-datasource.sh's header comment;
# range-namespaced.yaml uses the disjoint .161-.181 sub-block). Left
# literal ("${data.netRangeStartCluster}") if no datasource is supplied,
# which is exactly the pre-isolation behavior this guards against.
#
# Optional fields:
#   networkView: name of the NetworkView the range belongs to. This
#                example uses the Grid's well-known "default" network view
#                so it runs standalone without creating a NetworkView
#                resource first.
#   network:     CIDR of the parent network. Deliberately omitted here —
#                CreateNetworkRange requires the addresses to fall within
#                an already-provisioned Network object when this field (or
#                an inferred match) is set, and this E2E environment does
#                not pre-provision one (same class of prerequisite issue as
#                HostRecord's configureForDns — see host-record.yaml).
#                Set this to a real CIDR once a matching Network object
#                exists on the target Grid Manager.
#   template:    name of a RangeTemplate to pre-populate settings from.
#                Create-only — UpdateNetworkRange does not accept it, so it
#                has no atProvider mirror and is excluded from drift
#                comparison.
#
# Optional mutable fields: comment, extAttrs.
apiVersion: range.infobloxnios.crossplane.io/v1alpha1
kind: Range
metadata:
  name: example-range
  annotations:
    meta.upbound.io/example-id: range/v1alpha1/range
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
    # comment field below is a safe mutable scalar for update coverage;
    # field-level update testing runs through the post-assert hook wiring
    # and the crossplane.io/update-test annotation below.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-range.sh
    # comment is the only mutable scalar exercised here — extAttrs is also
    # mutable but comment alone is sufficient update coverage. startAddr,
    # endAddr, and networkView are mutable per the SDK's UpdateNetworkRange
    # signature but changing them here would rotate the range's identity
    # mid-test and destabilize the update-tester's convergence check.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: startAddr
        skip: "changing the range's addresses alters its live identity — not exercised via per-field diff testing"
      - field: endAddr
        skip: "changing the range's addresses alters its live identity — not exercised via per-field diff testing"
      - field: networkView
        skip: "changing the owning network view alters the range's live identity — not exercised via per-field diff testing"
      - field: network
        skip: "optional field intentionally omitted from this example (no pre-provisioned Network object in the E2E environment)"
      - field: template
        skip: "create-only parameter — UpdateNetworkRange does not accept it"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: networkViewRef
        skip: "reference field resolving to networkView; not exercised via per-field diff testing"
      - field: networkViewSelector
        skip: "reference field resolving to networkView; not exercised via per-field diff testing"
spec:
  forProvider:
    startAddr: ${data.netRangeStartCluster}
    endAddr: ${data.netRangeEndCluster}
    networkView: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
