# ARecord is the namespace-scoped variant of the Infoblox NIOS DNS "A"
# record. See record-a.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-a.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
apiVersion: recorda.infobloxnios.m.crossplane.io/v1alpha1
kind: ARecord
metadata:
  name: example-arecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recorda/v1alpha1/arecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-a.yaml for the rationale.
spec:
  forProvider:
    name: www-ns.example.com
    ipv4Addr: 192.0.2.20
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
