# ARecord is the namespace-scoped variant of the Infoblox NIOS DNS "A"
# record. See record-a.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-a.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
apiVersion: recorda.infobloxnios.m.crossplane.io/v1alpha1
kind: ARecord
metadata:
  name: example-arecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recorda/v1alpha1/arecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-a.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-a-namespaced.sh
    # See record-a.yaml for the useTtl/ttl transition rationale and the
    # skip rationale for name/extAttrs/cidr/networkView/removeAssociatedPtr.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: ipv4Addr
        value: "192.0.2.21"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "renaming changes the record's _ref (external identity); covered by controller unit tests instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: removeAssociatedPtr
        skip: "write-only delete-time option; never present in the observed state to exercise via update"
spec:
  forProvider:
    name: www-ns.example.com
    ipv4Addr: 192.0.2.20
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
