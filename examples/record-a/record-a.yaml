# ARecord is a cluster-scoped Infoblox NIOS DNS "A" record (WAPI object
# type record:a). See record-a-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:a/ZG5zLmJpbmRfYQ:www.example.com/default") from Create;
# Crossplane stores it in the crossplane.io/external-name annotation. Do
# not set that annotation manually — the controller populates it.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same (view, zone, name) WAPI identity. Left
# literal ("${data.runToken}") if no datasource is supplied, which is
# exactly the pre-isolation behavior this guards against.
#
# Required fields:
#   name:     owner name in FQDN format. WAPI ties the record's `_ref` to
#             (view, zone, name); the controller re-syncs the annotation
#             if a rename changes the `_ref`.
#   ipv4Addr: the IPv4 address the record resolves to. This example uses
#             a TEST-NET-1 address (RFC 5737) — replace with a real
#             address for a live NIOS Grid Manager.
#   view:     the DNS view the record is created in. Immutable after
#             creation (CEL rule enforced) — the UpdateARecord SDK call
#             has no view parameter.
#
# Optional mutable fields: comment, ttl, useTtl, extAttrs.
apiVersion: recorda.infobloxnios.crossplane.io/v1alpha1
kind: ARecord
metadata:
  name: example-arecord
  annotations:
    meta.upbound.io/example-id: recorda/v1alpha1/arecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-a.sh
    # comment, ipv4Addr, useTtl, and ttl are exercised here. useTtl
    # transitions to true (absent useTtl is treated as false by the
    # controller), then ttl is changed to a nonzero value while useTtl
    # stays on — see record-cname.yaml for the field-reported
    # reconcile-loop rationale behind this sequence and the hook's
    # post-update convergence check. name is mutable but renaming changes
    # the record's _ref (external identity); that behavior is already
    # covered by controller unit tests, so it is skipped here. extAttrs
    # is an optional map field skipped for low update-test value. cidr
    # and networkView are create-time-only next-available-IP allocation
    # inputs (ignored on Update per the SDK). removeAssociatedPtr is a
    # write-only delete-time option, never present in the observed state.
    # useTtl is then flipped back to false as the final tested entry.
    # That reverse direction is the half that regressed in the field: the
    # flip must still be detected as drift, and once the flag is off the
    # ttl value must stop being compared at all — spec.forProvider.ttl
    # stays at 3600 while WAPI reports the zone default in
    # status.atProvider.ttl, and that divergence is correct. Step C of
    # the hook runs with the flag off and fails the build if the
    # resource keeps issuing Update calls in that state.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: ipv4Addr
        value: "192.0.2.11"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "renaming changes the record's _ref (external identity); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: removeAssociatedPtr
        skip: "write-only delete-time option; never present in the observed state to exercise via update"
spec:
  forProvider:
    name: www-${data.runToken}.example.com
    ipv4Addr: 192.0.2.10
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
