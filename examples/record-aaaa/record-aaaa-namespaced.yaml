# AAAARecord is the namespace-scoped variant of the Infoblox NIOS DNS "AAAA"
# record. See record-aaaa.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-aaaa.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
#
# ${data.runToken}: see record-aaaa.yaml — same per-run isolation token,
# applied here too so this scope's identity ALSO differs across
# concurrent E2E runs, not just from its cluster-scoped sibling.
apiVersion: recordaaaa.infobloxnios.m.crossplane.io/v1alpha1
kind: AAAARecord
metadata:
  name: example-aaaarecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordaaaa/v1alpha1/aaaarecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-aaaa.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-aaaa-namespaced.sh
    # See record-aaaa.yaml for the useTtl/ttl transition rationale and
    # the skip rationale for name/extAttrs/cidr/networkView/removeAssociatedPtr.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: ipv6Addr
        value: "2001:db8::21"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "renaming changes the record's _ref (external identity); not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: removeAssociatedPtr
        skip: "write-only delete-time option; never present in the observed state to exercise via update"
spec:
  forProvider:
    name: www6-ns-${data.runToken}.example.com
    ipv6Addr: "2001:db8::20"
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
