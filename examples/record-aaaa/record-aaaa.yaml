# AAAARecord is a cluster-scoped Infoblox NIOS DNS "AAAA" record (WAPI object
# type record:aaaa). See record-aaaa-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:aaaa/ZG5zLmJpbmRfYWFhYQ:www6.example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name annotation.
# Do not set that annotation manually — the controller populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout is sufficient.
#
# Required fields:
#   name:     owner name in FQDN format. WAPI ties the record's `_ref` to
#             (view, zone, name); the controller re-syncs the annotation
#             if a rename changes the `_ref`.
#   ipv6Addr: the IPv6 address the record resolves to. This example uses
#             a documentation-only address (RFC 3849, 2001:db8::/32) —
#             replace with a real address for a live NIOS Grid Manager.
#   view:     the DNS view the record is created in. Immutable after
#             creation (CEL rule enforced) — the UpdateAAAARecord SDK call
#             has no view parameter.
#
# Optional mutable fields: comment, ttl, useTtl, extAttrs.
apiVersion: recordaaaa.infobloxnios.crossplane.io/v1alpha1
kind: AAAARecord
metadata:
  name: example-aaaarecord
  annotations:
    meta.upbound.io/example-id: recordaaaa/v1alpha1/aaaarecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-aaaa.sh
    # comment, ipv6Addr, useTtl, and ttl are exercised here. useTtl
    # transitions to true (absent useTtl is treated as false by the
    # controller), then ttl is changed to a nonzero value while useTtl
    # stays on. This sequence, together with the hook's post-update
    # convergence check, proves the fix for a field-reported perpetual
    # reconcile loop: the controller used to keep comparing the submitted
    # ttl against the server's zone-default TTL even with useTtl off, so
    # the two never matched and every reconcile issued a spurious Update
    # call — a state that still reports Ready throughout, hence the
    # explicit convergence assertion rather than a Ready check alone.
    # name is mutable but renaming changes the record's _ref (external
    # identity); that behavior is already covered by controller unit
    # tests, so it is skipped here. extAttrs is an optional map field
    # skipped for low update-test value. cidr and networkView are
    # create-time-only next-available-IP allocation inputs (ignored on
    # Update per the SDK). removeAssociatedPtr is a write-only delete-time
    # option, never present in the observed state.
    # useTtl is then flipped back to false as the final tested entry.
    # That reverse direction is the half that regressed in the field: the
    # flip must still be detected as drift, and once the flag is off the
    # ttl value must stop being compared at all — spec.forProvider.ttl
    # stays at 3600 while WAPI reports the zone default in
    # status.atProvider.ttl, and that divergence is correct. Step C of
    # the hook runs with the flag off and fails the build if the
    # resource keeps issuing Update calls in that state.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: ipv6Addr
        value: "2001:db8::11"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "renaming changes the record's _ref (external identity); covered by controller unit tests instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: removeAssociatedPtr
        skip: "write-only delete-time option; never present in the observed state to exercise via update"
spec:
  forProvider:
    name: www6.example.com
    ipv6Addr: "2001:db8::10"
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
