# AliasRecord is the namespace-scoped variant of the Infoblox NIOS DNS
# "Alias" record. See record-alias.yaml for the cluster-scoped variant and
# full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-alias.yaml's
# so both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
apiVersion: recordalias.infobloxnios.m.crossplane.io/v1alpha1
kind: AliasRecord
metadata:
  name: example-aliasrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordalias/v1alpha1/aliasrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-alias.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-alias-namespaced.sh
    # See record-alias.yaml for the useTtl/ttl transition rationale and
    # the skip rationale for name/extAttrs.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: targetName
        value: "updated-target-ns.example.com"
      - field: targetType
        value: "AAAA"
      - field: disable
        value: true
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "renaming changes the record's _ref (external identity); covered by controller unit tests instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: alias-test-ns.example.com
    targetName: target-ns.example.com
    targetType: A
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
