# CNAMERecord is the namespace-scoped variant of the Infoblox NIOS DNS
# "CNAME" record. See record-cname.yaml for the cluster-scoped variant and
# full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the alias name below differs from record-cname.yaml's
# so both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
apiVersion: recordcname.infobloxnios.m.crossplane.io/v1alpha1
kind: CNAMERecord
metadata:
  name: example-cnamerecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordcname/v1alpha1/cnamerecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-cname.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-cname-namespaced.sh
    # useTtl transitions false -> true here (matching the spec below,
    # which starts at useTtl: false / ttl: 0 — the exact configuration
    # that produced a field-reported perpetual reconcile loop), then ttl
    # is changed to a nonzero value while useTtl stays on. See
    # record-cname.yaml for the full explanation; this namespaced variant
    # mirrors the same regression coverage.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by uptest (namespaced)"
      - field: canonical
        value: "updated-target-ns.example.com"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "renaming changes the record's _ref (external identity); covered by controller unit tests instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: alias-ns.example.com
    canonical: www-ns.example.com
    view: default
    comment: Managed by Crossplane (namespaced)
    ttl: 0
    useTtl: false
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
