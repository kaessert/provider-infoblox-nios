# MXRecord is the namespace-scoped variant of the Infoblox NIOS DNS "MX"
# record. See record-mx.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-mx.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
#
# ${data.runToken}: see record-mx.yaml — same per-run isolation token,
# applied here too so this scope's identity ALSO differs across
# concurrent E2E runs, not just from its cluster-scoped sibling.
apiVersion: recordmx.infobloxnios.m.crossplane.io/v1alpha1
kind: MXRecord
metadata:
  name: example-mxrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordmx/v1alpha1/mxrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-mx.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-mx-namespaced.sh
    # See record-mx.yaml for the useTtl/ttl transition rationale and the
    # skip rationale for name/mailExchanger/preference/extAttrs.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: mailExchanger
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: preference
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-mx-ns-${data.runToken}.example.com
    mailExchanger: mail-ns.example.com
    preference: 20
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
