# MXRecord is a cluster-scoped Infoblox NIOS DNS "MX" record (WAPI object
# type record:mx). See record-mx-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:mx/ZG5zLmJpbmRfbXg:test-mx.example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout is sufficient.
#
# Required fields:
#   name:          owner name (FQDN) the MX record applies to. WAPI ties
#                  the record's `_ref` to (view, zone, name); the
#                  controller re-syncs the annotation if a rename changes
#                  the `_ref`.
#   mailExchanger: mail exchanger hostname in FQDN format.
#   preference:    preference value, 0-65535 — lower values are preferred.
#   view:          the DNS view the record is created in. Immutable after
#                  creation (CEL rule enforced) — the UpdateMXRecord SDK
#                  call has no view parameter.
#
# Optional mutable fields: comment, ttl, useTtl, extAttrs.
apiVersion: recordmx.infobloxnios.crossplane.io/v1alpha1
kind: MXRecord
metadata:
  name: example-mxrecord
  annotations:
    meta.upbound.io/example-id: recordmx/v1alpha1/mxrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-mx.sh
    # comment, useTtl, and ttl are exercised here. useTtl transitions to
    # true (absent useTtl is treated as false by the controller), then
    # ttl is changed to a nonzero value while useTtl stays on — see
    # record-cname.yaml for the field-reported reconcile-loop rationale
    # behind this sequence and the hook's post-update convergence check.
    # name, mailExchanger, and preference are mutable but each is part of
    # the record's identity tuple (view, name, mailExchanger, preference)
    # that WAPI uses to compute the _ref; changing any of them mutates
    # the _ref and is already covered by controller unit tests, so they
    # are skipped here to keep the live update test scoped to
    # identity-preserving field changes. extAttrs is an optional map
    # field skipped for low update-test value.
    # useTtl is then flipped back to false as the final tested entry.
    # That reverse direction is the half that regressed in the field: the
    # flip must still be detected as drift, and once the flag is off the
    # ttl value must stop being compared at all — spec.forProvider.ttl
    # stays at 3600 while WAPI reports the zone default in
    # status.atProvider.ttl, and that divergence is correct. Step C of
    # the hook runs with the flag off and fails the build if the
    # resource keeps issuing Update calls in that state.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, covered by controller unit tests instead"
      - field: mailExchanger
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, covered by controller unit tests instead"
      - field: preference
        skip: "part of the record's identity tuple; changing it mutates the WAPI _ref, covered by controller unit tests instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: test-mx.example.com
    mailExchanger: mail.example.com
    preference: 10
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
