# NSRecord is the namespace-scoped variant of the Infoblox NIOS DNS
# delegation "NS" record. See record-ns.yaml for the cluster-scoped
# variant and full field documentation — this file only documents what
# differs.
#
# This example references the cluster-scoped ClusterProviderConfig
# (usable by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the delegated name below differs from record-ns.yaml's
# so both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity. Like
# record-ns.yaml, `name` MUST be a zone-apex name, not a subdomain — see
# record-ns.yaml's "NS quirk" note for why.
#
# ${data.runToken}: see record-ns.yaml's runToken comment — nameserver is
# tokenised (not name/view) because this record's identity ladder makes
# name/view shared Grid context, not tokenisable identity. "-ns-" keeps
# this scope's nameserver distinct from record-ns.yaml's within a run,
# on top of the pre-existing distinct zone-apex.
apiVersion: recordns.infobloxnios.m.crossplane.io/v1alpha1
kind: NSRecord
metadata:
  name: example-nsrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordns/v1alpha1/nsrecord
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-ns.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-ns-namespaced.sh
    # See record-ns.yaml for the nameserver/msDelegationName/addresses
    # rationale.
    crossplane.io/update-test: |
      - field: nameserver
        skip: "immutable after creation — enforced by a CEL rule on the CRD (self == oldSelf); an apply that changes it is rejected at admission and never reaches the controller, so no update-test can run against it. The field is also part of this record's natural key (name, view, nameserver), which is why it carries the run token instead of a literal value: name/view are shared Grid context across every concurrent E2E run of this scope, so nameserver is the run's only isolating identity component"
      - field: msDelegationName
        skip: "MS delegation point name — only persisted on Microsoft/AD-integrated zones; NIOS silently drops it (HTTP 200, field absent from the response) on ordinary Grid-managed zones"
      - field: addresses
        skip: "list field of glue address records; not a safe scalar update-test target"
spec:
  forProvider:
    name: example.com
    nameserver: ns1-ns-${data.runToken}.example.com
    addresses:
      - address: 192.0.2.54
        autoCreatePtr: false
    view: Internal
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
