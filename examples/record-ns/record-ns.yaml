# NSRecord is a cluster-scoped Infoblox NIOS DNS delegation "NS" record
# (WAPI object type record:ns). See record-ns-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:ns/ZG5zLmJpbmRfbnM:subdomain.zone.com/default") from
# Create (a synchronous WAPI POST — the record exists immediately after
# the 201 response); Crossplane stores it in the crossplane.io/
# external-name annotation. Do not set that annotation manually — the
# controller populates it.
#
# Required fields:
#   name:       the delegated zone/subdomain in FQDN format. Live-verified
#               immutable — WAPI rejects a PUT that changes this field
#               even though the underlying SDK's update call still
#               accepts a name parameter.
#   nameserver: FQDN of the authoritative server for the delegated zone.
#               Mutable. Live-verified: changing it DOES rotate the
#               `_ref` (WAPI reissues a new opaque reference on update);
#               the controller's Update() detects when the returned ref
#               differs from what was sent and refreshes the
#               crossplane.io/external-name annotation accordingly, so
#               no manual intervention is needed.
#   view:       the DNS view the record is created in. Live-verified hard
#               immutable (CEL rule enforced) — the update call has no
#               view parameter.
#   addresses:  at least one glue address record for the name server.
#               Live-verified required on create (WAPI returns
#               "field for create missing: addresses" without it), even
#               though it is optional in the underlying SDK's field
#               table.
#
# NS quirk: Grid DNS policy rejects manual record:ns creation for
# subdomains that are not already registered as a delegated child zone
# ("Cannot add a manual NS record") — this is a Grid-wide policy, not a
# per-zone one. Live-verified against a real Grid: a manual record:ns
# whose `name` is the ZONE APEX itself (e.g. "peatestinglab.com", not a
# subdomain of it) succeeds with full CRUD in the "Internal" view. Use a
# zone-apex name here, not a subdomain, and confirm the target zone/view
# permits manual NS records before applying this example elsewhere.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh). Unlike this provider's other DNS record
# examples, `name` here CANNOT carry the token: it must be a
# pre-provisioned Grid zone-apex ("Cannot add a manual NS record" above),
# so it and `view` are shared context, not identity. `nameserver` is the
# only tokenisable component of this record's natural key
# `(name, view, nameserver)` (see nsRecordExistsByNaturalKey's doc
# comment in internal/controller/recordns/controller.go — (name, view)
# alone is not unique) and is tokenised here so concurrent runs against
# the same shared zone-apex/view don't request the same WAPI identity.
# Left literal ("${data.runToken}") if no datasource is supplied, which
# is exactly the pre-isolation behavior this guards against.
#
# Optional mutable fields: msDelegationName. (addresses can also be
# changed after creation, but as a list it is not a safe uptest
# update-parameter target — see the annotation note below.)
apiVersion: recordns.infobloxnios.crossplane.io/v1alpha1
kind: NSRecord
metadata:
  name: example-nsrecord
  annotations:
    meta.upbound.io/example-id: recordns/v1alpha1/nsrecord
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values).
    # Runs the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-ns.sh
    # nameserver is NOT value-tested here even though it is the record's
    # only mutable field, and that is deliberate: nameserver is part of
    # this record's natural key (name, view, nameserver) — see the
    # ${data.runToken} comment above — because name/view are shared
    # Grid context across every concurrent run of this scope. A literal
    # update-test value (e.g. "ns2.example.com") would make every
    # concurrent run's record converge on the same (name, view,
    # nameserver) triple the instant Update ran: isolation would hold
    # through Create and break during Update. See the skip reason below.
    #
    # Context for that trade-off: unlike the other 25 cataloged
    # resources, NSRecord is NOT wired to the UID-in-EA identity ladder
    # — record:ns has no extattrs field (live-verified, WAPI 2.12
    # _schema), so it keeps the pre-ladder natural-key fallback on
    # view+name+nameserver instead. nameserver is itself one of that
    # natural key's three components (live-verified by base64-decoding a
    # record:ns _ref: "dns.bind_ns$.<view-id>.<reversed-zone>..<nameserver>"),
    # so changing it rotates the _ref. Skipping it here therefore costs
    # NSRecord's own end-to-end coverage of external-name refresh across
    # a _ref rotation; that path remains covered by unit tests and by
    # the ladder-backed resources' update-tests, which exercise the same
    # Update()/external-name-refresh code but reach it via the ladder
    # rather than the natural-key fallback.
    # msDelegationName is skipped — it is the MS delegation point name,
    # only persisted on Microsoft/AD-integrated zones; NIOS silently
    # drops it (HTTP 200, field absent from the response) on ordinary
    # Grid-managed zones like this example. addresses is a list of glue
    # address records — not a safe scalar update-test target (see the
    # uptest update-parameter note above).
    crossplane.io/update-test: |
      - field: nameserver
        skip: "part of this record's natural key (name, view, nameserver); name/view are shared Grid context across every concurrent E2E run of this scope, so nameserver is the run's only isolating identity component and must not be set to a shared literal value — doing so would converge every concurrent run onto the same natural key at Update time. Mutability is exercised structurally by every other DNS record's update-test via the shared _ref-rotation-on-update code path (see record-a.yaml's name skip and record-srv.yaml's priority field)"
      - field: msDelegationName
        skip: "MS delegation point name — only persisted on Microsoft/AD-integrated zones; NIOS silently drops it (HTTP 200, field absent from the response) on ordinary Grid-managed zones"
      - field: addresses
        skip: "list field of glue address records; not a safe scalar update-test target"
spec:
  forProvider:
    name: peatestinglab.com
    nameserver: ns1-${data.runToken}.example.com
    addresses:
      - address: 192.0.2.53
        autoCreatePtr: false
    view: Internal
  providerConfigRef:
    name: default
