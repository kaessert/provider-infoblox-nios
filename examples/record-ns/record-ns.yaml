# NSRecord is a cluster-scoped Infoblox NIOS DNS delegation "NS" record
# (WAPI object type record:ns). See record-ns-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:ns/ZG5zLmJpbmRfbnM:subdomain.zone.com/default") from
# Create (a synchronous WAPI POST — the record exists immediately after
# the 201 response); Crossplane stores it in the crossplane.io/
# external-name annotation. Do not set that annotation manually — the
# controller populates it.
#
# Required fields:
#   name:       the delegated zone/subdomain in FQDN format. Live-verified
#               immutable — WAPI rejects a PUT that changes this field
#               even though the underlying SDK's update call still
#               accepts a name parameter.
#   nameserver: FQDN of the authoritative server for the delegated zone.
#               Mutable — not part of the record's (view, zone, name)
#               identity, so changing it does not rotate the `_ref`.
#   view:       the DNS view the record is created in. Live-verified hard
#               immutable (CEL rule enforced) — the update call has no
#               view parameter.
#   addresses:  at least one glue address record for the name server.
#               Live-verified required on create (WAPI returns
#               "field for create missing: addresses" without it), even
#               though it is optional in the underlying SDK's field
#               table.
#
# NS quirk: many Grids reject POST record:ns for any subdomain that is not
# already registered as a delegated child zone — the rejection is a
# Grid-wide DNS policy setting, not a per-zone one, so switching to a
# different existing auth zone does not help. Re-verified end-to-end
# against a real Grid (via both the deployed controller and direct WAPI
# calls): under a non-existent parent zone the create fails with
# "The action is not allowed. A parent was not found."; under an existing
# auth zone (e.g. example.com) it fails with "Cannot add a manual NS
# record with the name <n> in the zone <z>"; and even a freshly
# provisioned `zone_delegated` child zone rejects a manual record:ns
# pointed at its own apex with "Cannot add an empty named record to the
# zone <z>, which is not authoritative" (WAPI auto-manages NS delegation
# records for `zone_delegated` — there is no manual attachment point).
# No combination of pre-existing or freshly created zone was found where
# manual record:ns creation succeeds on this Grid. Before applying this
# example, have a Grid administrator confirm manual NS record creation is
# permitted for the target zone/view, or use the resulting `zone_delegated`
# object's auto-managed NS records instead of a standalone NSRecord.
#
# Optional mutable fields: msDelegationName. (addresses can also be
# changed after creation, but as a list it is not a safe uptest
# update-parameter target — see the annotation note below.)
apiVersion: recordns.infobloxnios.crossplane.io/v1alpha1
kind: NSRecord
metadata:
  name: example-nsrecord
  annotations:
    meta.upbound.io/example-id: recordns/v1alpha1/nsrecord
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values).
    # Runs the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-ns.sh
    # nameserver is the mutable scalar exercised here. It is intentionally
    # NOT one of the record's identity fields (name, view) — changing
    # either of those would rotate the WAPI `_ref` mid-test and
    # destabilize the update-tester's convergence check.
    crossplane.io/update-test: |
      - field: nameserver
        value: "ns2.example.com"
spec:
  forProvider:
    name: subdomain.zone.com
    nameserver: ns1.example.com
    addresses:
      - address: 192.0.2.53
        autoCreatePtr: false
    view: default
  providerConfigRef:
    name: default
