# arecord-ptr-ref-prereq.yaml — prerequisite ARecord for record-ptr-ref.yaml,
# the one example in this directory that resolves its ptrdname field
# through ptrdnameRef instead of setting the literal value
# record-ptr.yaml/record-ptr-namespaced.yaml use.
#
# The reference resolver needs a real ARecord managed resource in the
# cluster to resolve against, so this manifest creates one purely as a
# dependency. Makefile prerequisite-bundling (UPTEST_MANIFESTS_RECORD_PTR)
# lists it before record-ptr-ref.yaml so uptest creates it first — same
# pattern as examples/record-cname/arecord-cname-ref-prereq.yaml (a
# prerequisite ARecord for record-cname-ref.yaml's canonicalRef).
#
# ${data.runToken}: reuses the SAME per-run isolation token
# examples/record-cname/record-cname.yaml and examples/record-a/record-a.yaml
# already draw (see test/e2e/gen-datasource.sh) so this prerequisite's name
# never collides with a concurrent run's. The literal "target-ptr-ref-"
# prefix (distinct from record-a.yaml's own "www-" prefix and
# record-cname's "target-cname-ref-" prefix) keeps the objects from
# colliding with each other within the same run, even though they share
# the token.
#
# This manifest intentionally carries no update-test annotation and no
# uptest.upbound.io/post-assert-hook annotation: record-ptr-ref.yaml's
# reference resolution depends on this object's identity staying stable
# for the whole run, and it is not itself a resource under test — see
# examples/record-a/record-a.yaml for the general-purpose, independently
# update-tested ARecord example.
apiVersion: recorda.infobloxnios.crossplane.io/v1alpha1
kind: ARecord
metadata:
  name: example-record-ptr-ref-target
  annotations:
    meta.upbound.io/example-id: recorda/v1alpha1/arecord
    uptest.upbound.io/timeout: "120"
spec:
  forProvider:
    name: target-ptr-ref-${data.runToken}.example.com
    ipv4Addr: 192.0.2.30
    view: default
    comment: "Prerequisite ARecord for record-ptr-ref.yaml (ptrdnameRef E2E coverage)"
  providerConfigRef:
    name: default
