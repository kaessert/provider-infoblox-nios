# PTRRecord is the namespace-scoped variant of the Infoblox NIOS DNS "PTR"
# record. See record-ptr.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the ipv4Addr below is the disjoint
# ${data.netPtrHostNamespaced} half of the shared 10.1.1.0/24 reverse-zone
# pool (see record-ptr.yaml's "Identity" and "E2E fixture note" sections)
# so both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, in-addr.arpa name) WAPI identity.
#
# E2E fixture note: see record-ptr.yaml's "E2E fixture note" — ipv4Addr must
# be in 10.1.1.0/24 and view must be "Internal" to match the only reverse
# zone configured on the test Grid Manager.
apiVersion: recordptr.infobloxnios.m.crossplane.io/v1alpha1
kind: PTRRecord
metadata:
  name: example-ptrrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordptr/v1alpha1/ptrrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-ptr.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-ptr-namespaced.sh
    # See record-ptr.yaml for the useTtl/ttl transition rationale and the
    # skip rationale for ptrdname/name/ipv4Addr/ipv6Addr/extAttrs/cidr/networkView.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: ptrdname
        skip: "_ref-mutating identity field for PTRRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: name
        skip: "_ref-mutating identity field for PTRRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: ipv4Addr
        skip: "keys the record and the auto-derived name; changing it risks _ref rotation, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: ipv6Addr
        skip: "mutually exclusive with ipv4Addr, unset in this example"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
spec:
  forProvider:
    ptrdname: www-ns.example.com
    ipv4Addr: ${data.netPtrHostNamespaced}
    view: Internal
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
