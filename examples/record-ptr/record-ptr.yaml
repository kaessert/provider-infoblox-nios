# PTRRecord is a cluster-scoped Infoblox NIOS DNS "PTR" record (WAPI object
# type record:ptr). See record-ptr-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:ptr/ZG5zLmJpbmRfcHRy:10.2.0.192.in-addr.arpa/default") from
# Create; Crossplane stores it in the crossplane.io/external-name annotation.
# Do not set that annotation manually — the controller populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout is sufficient.
#
# Required fields:
#   ptrdname: the FQDN this PTR record points to. Changing it updates the
#             record's `_ref` (best-effort target — WAPI does not verify
#             that the referenced A/AAAA record exists).
#   view:     the DNS view the record is created in. Hard immutable for
#             PTRRecord (CEL rule enforced) — WAPI rejects updates with
#             "Field is not allowed for update: view".
#
# ipv4Addr (or ipv6Addr, mutually exclusive) keys the record and is used to
# derive the in-addr.arpa `name` when `name` is omitted, as in this example.
#
# Optional mutable fields: name, comment, ttl, useTtl, extAttrs.
#
# Identity is primarily the ADDRESS, not a name — correcting an earlier
# classification of this resource as a pure named object. The controller's
# ptrRecordExistsByNaturalKey searches on (view, ptrdname, name/ip)
# together, but with `name` omitted from this example the reverse-mapping
# name is derived entirely from ipv4Addr, so the address is what actually
# disambiguates concurrent runs on WAPI; ptrdname here is payload (the
# forward FQDN the PTR points to), not identity.
#
# E2E fixture note: PTR record creation requires a matching reverse-mapping
# zone (record:ptr's reverse `zone_auth`) to already exist on the Grid for
# ipv4Addr's network in the given view — WAPI returns 400
# IB.Data.Conflict("An invalid IP address or reverse zone was specified.")
# otherwise. This test Grid Manager only has a reverse zone for 10.1.1.0/24
# in DNS view "Internal" (no reverse zone exists in view "default"), so this
# example intentionally deviates from record-a's 192.0.2.0/24 (TEST-NET-1)
# convention and view "default". test/setup.sh creates no per-run reverse
# zone — it stays a convergent, idempotent provisioner of shared prerequisites
# rather than a per-run mutator — and a 100.64.0.0/16 netPrefix address has no
# reverse zone at all, so this
# resource cannot use the netPrefix mechanism the other IPAM-wave resources
# use. Instead ${data.netPtrHostCluster} is a per-run host offset drawn
# from a second, independent byte of the seed hash and confined to the
# existing 10.1.1.0/24 reverse zone's address pool (see
# test/e2e/gen-datasource.sh's header comment for the full derivation and
# the documented, accepted collision-probability tradeoff versus
# netPrefix's larger pool). record-ptr-namespaced.yaml uses the disjoint
# ${data.netPtrHostNamespaced} half of that same pool.
apiVersion: recordptr.infobloxnios.crossplane.io/v1alpha1
kind: PTRRecord
metadata:
  name: example-ptrrecord
  annotations:
    meta.upbound.io/example-id: recordptr/v1alpha1/ptrrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-ptr.sh
    # comment, useTtl, and ttl are exercised here. useTtl transitions to
    # true (absent useTtl is treated as false by the controller), then
    # ttl is changed to a nonzero value while useTtl stays on — see
    # record-cname.yaml for the field-reported reconcile-loop rationale
    # behind this sequence and the hook's post-update convergence check.
    # ptrdname and name are both _ref-mutating fields for PTRRecord
    # (changing either can return a new WAPI _ref); that rotation is
    # already exercised by controller unit tests, so both are skipped
    # here to keep the live update test scoped to identity-preserving
    # field changes. ipv4Addr keys the record and the auto-derived name
    # this example relies on (name is omitted from spec), so it is
    # skipped for the same identity-rotation reason. ipv6Addr is mutually
    # exclusive with ipv4Addr and unset in this example. cidr and
    # networkView are create-time-only next-available-IP allocation
    # inputs (ignored on Update per the SDK). extAttrs is an optional map
    # field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: ptrdname
        skip: "_ref-mutating identity field for PTRRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: name
        skip: "_ref-mutating identity field for PTRRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: ipv4Addr
        skip: "keys the record and the auto-derived name; changing it risks _ref rotation, not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: ipv6Addr
        skip: "mutually exclusive with ipv4Addr, unset in this example"
      - field: extAttrs
        skip: "optional map field, low update-test value"
      - field: cidr
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
      - field: networkView
        skip: "create-time-only next-available-IP allocation input, ignored on Update"
spec:
  forProvider:
    ptrdname: www.example.com
    ipv4Addr: ${data.netPtrHostCluster}
    view: Internal
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
