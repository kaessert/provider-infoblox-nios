# SRVRecord is a cluster-scoped Infoblox NIOS DNS "SRV" record (WAPI object
# type record:srv). See record-srv-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:srv/ZG5zLmJpbmRfc3J2:_sip._tcp.example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name annotation.
# Do not set that annotation manually — the controller populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout is sufficient.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same (view, zone, name) WAPI identity. Left
# literal ("${data.runToken}") if no datasource is supplied, which is
# exactly the pre-isolation behavior this guards against. Spliced into
# the owner portion after the RFC 2782 service/protocol labels
# ("_sip._tcp"), never ahead of or inside them — those labels must stay
# leftmost for WAPI/DNS to recognize the record as an SRV record.
#
# Required fields:
#   name:     owner name in FQDN format, following the standard SRV naming
#             convention "_service._proto.name" (e.g. "_sip._tcp.example.com").
#             WAPI ties the record's `_ref` to (view, zone, name); the
#             controller re-syncs the annotation if a rename changes the `_ref`.
#   target:   target host in FQDN format that answers the service.
#   priority: priority of the record (0-65535) — lower values are preferred.
#   weight:   relative weight (0-65535) for records with the same priority.
#   port:     TCP/UDP port (0-65535) on the target host.
#   view:     the DNS view the record is created in. Immutable after
#             creation (CEL rule enforced) — the UpdateSRVRecord SDK call
#             has no view parameter.
#
# Optional mutable fields: comment, ttl, useTtl, extAttrs. priority (a
# required field) is also mutable and rotates the record's `_ref` on
# change; the update-test annotation below exercises that rotation
# end-to-end to prove the refreshed external-name annotation persists.
apiVersion: recordsrv.infobloxnios.crossplane.io/v1alpha1
kind: SRVRecord
metadata:
  name: example-srvrecord
  annotations:
    meta.upbound.io/example-id: recordsrv/v1alpha1/srvrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-srv.sh
    # comment is the mutable scalar exercised here alongside useTtl and
    # ttl. priority is also exercised below — it is one of the five
    # _ref-mutating fields (name, target, priority, weight, port), and
    # changing it rotates the WAPI `_ref` mid-test. That rotation is the
    # exact scenario that used to wedge the resource: the controller's
    # Update() call refreshed crossplane.io/external-name in memory, but
    # crossplane-runtime only persists the status subresource after a
    # successful external Update(), so the refreshed annotation was
    # silently discarded and the next Observe() 404'd against the stale
    # ref. Exercising priority here proves the annotation refresh is
    # actually persisted end-to-end (patch → WaitReady → poll
    # status.atProvider.priority), rather than merely asserted in memory
    # by a controller unit test. name, target, weight, and port are also
    # _ref-mutating but stay skipped below — asserting their post-rotation
    # value here would just repeat the same rotation flow priority already
    # proves; see their skip reasons. useTtl transitions to true
    # (absent useTtl is treated as false by the controller), then ttl is
    # changed to a nonzero value while useTtl stays on — see
    # record-cname.yaml for the field-reported reconcile-loop rationale
    # behind this sequence and the hook's post-update convergence check.
    # extAttrs is an optional map field skipped for low update-test value.
    # useTtl is then flipped back to false as the final tested entry.
    # That reverse direction is the half that regressed in the field: the
    # flip must still be detected as drift, and once the flag is off the
    # ttl value must stop being compared at all — spec.forProvider.ttl
    # stays at 3600 while WAPI reports the zone default in
    # status.atProvider.ttl, and that divergence is correct. Step C of
    # the hook runs with the flag off and fails the build if the
    # resource keeps issuing Update calls in that state.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: useTtl
        value: false
      - field: name
        skip: "_ref-mutating identity field for SRVRecord; renaming would require predicting the rotated external-name ref ahead of time to assert it — the priority field below already exercises _ref rotation end-to-end for this resource"
      - field: target
        skip: "_ref-mutating identity field for SRVRecord; changing it would require predicting the rotated external-name ref ahead of time to assert it — the priority field below already exercises _ref rotation end-to-end for this resource"
      - field: priority
        value: 30
      - field: weight
        skip: "_ref-mutating identity field for SRVRecord; changing it would require predicting the rotated external-name ref ahead of time to assert it — the priority field above already exercises _ref rotation end-to-end for this resource"
      - field: port
        skip: "_ref-mutating identity field for SRVRecord; changing it would require predicting the rotated external-name ref ahead of time to assert it — the priority field above already exercises _ref rotation end-to-end for this resource"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: _sip._tcp.${data.runToken}.example.com
    target: sipserver.example.com
    priority: 10
    weight: 20
    port: 5060
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
