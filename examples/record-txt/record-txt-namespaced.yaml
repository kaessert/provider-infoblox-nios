# TXTRecord is the namespace-scoped variant of the Infoblox NIOS DNS "TXT"
# record. See record-txt.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-txt.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
#
# ${data.runToken}: see record-txt.yaml — same per-run isolation token,
# applied here too so this scope's identity ALSO differs across
# concurrent E2E runs, not just from its cluster-scoped sibling. text
# stays literal here too — see record-txt.yaml for why.
apiVersion: recordtxt.infobloxnios.m.crossplane.io/v1alpha1
kind: TXTRecord
metadata:
  name: example-txtrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordtxt/v1alpha1/txtrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-txt.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-txt-namespaced.sh
    # See record-txt.yaml for the useTtl/ttl transition rationale and
    # the skip rationale for name/text/extAttrs.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "_ref-mutating identity field for TXTRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: text
        skip: "_ref-mutating identity field for TXTRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: txt-ns-${data.runToken}.example.com
    text: "v=spf1 -all"
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
