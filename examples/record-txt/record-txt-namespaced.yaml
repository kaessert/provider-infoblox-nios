# TXTRecord is the namespace-scoped variant of the Infoblox NIOS DNS "TXT"
# record. See record-txt.yaml for the cluster-scoped variant and full field
# documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the owner name below differs from record-txt.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, zone, name) WAPI identity.
apiVersion: recordtxt.infobloxnios.m.crossplane.io/v1alpha1
kind: TXTRecord
metadata:
  name: example-txtrecord-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: recordtxt/v1alpha1/txtrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # record-txt.yaml for the rationale.
spec:
  forProvider:
    name: txt-ns.example.com
    text: "v=spf1 -all"
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
