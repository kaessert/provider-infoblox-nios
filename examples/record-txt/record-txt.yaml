# TXTRecord is a cluster-scoped Infoblox NIOS DNS "TXT" record (WAPI object
# type record:txt). See record-txt-namespaced.yaml for the namespace-scoped
# variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "record:txt/ZG5zLmJpbmRfdHh0:example.com/default") from Create;
# Crossplane stores it in the crossplane.io/external-name annotation. Do
# not set that annotation manually — the controller populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 200/201), so the default uptest timeout is sufficient.
#
# ${data.runToken}: injected by uptest from the --data-source file (see
# test/e2e/gen-datasource.sh) so concurrent E2E runs against the shared
# NIOS Grid never request the same (view, zone, name) WAPI identity. Left
# literal ("${data.runToken}") if no datasource is supplied, which is
# exactly the pre-isolation behavior this guards against.
#
# text is deliberately NOT tokenised: WAPI record:txt uniqueness is keyed
# on (view, zone, name); the tokenised name already makes the record
# unique per run, so duplicate text content across concurrent runs is
# legal.
#
# Required fields:
#   name: owner name in FQDN format. WAPI ties the record's `_ref` to
#         (view, zone, name); the controller re-syncs the annotation if a
#         rename changes the `_ref`.
#   text: text content, up to 255 bytes per substring and 512 bytes total.
#         Changing this value changes the record's `_ref`.
#   view: the DNS view the record is created in. Soft-immutable — the WAPI
#         schema reports it as updatable, but a PUT that changes view is
#         rejected at runtime (CEL rule enforced).
#
# Optional mutable fields: comment, ttl, useTtl, extAttrs.
apiVersion: recordtxt.infobloxnios.crossplane.io/v1alpha1
kind: TXTRecord
metadata:
  name: example-txtrecord
  annotations:
    meta.upbound.io/example-id: recordtxt/v1alpha1/txtrecord
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). Runs
    # the per-field update tester after uptest asserts Ready.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-record-txt.sh
    # comment, useTtl, and ttl are exercised here. useTtl transitions to
    # true (absent useTtl is treated as false by the controller), then
    # ttl is changed to a nonzero value while useTtl stays on — see
    # record-cname.yaml for the field-reported reconcile-loop rationale
    # behind this sequence and the hook's post-update convergence check.
    # name and text are both _ref-mutating identity fields for TXTRecord;
    # that rotation is already exercised by controller unit tests, so
    # both are skipped here to keep the live update test scoped to
    # identity-preserving field changes. extAttrs is an optional map
    # field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: useTtl
        value: true
      - field: ttl
        value: 3600
      - field: name
        skip: "_ref-mutating identity field for TXTRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: text
        skip: "_ref-mutating identity field for TXTRecord; not exercised here — asserting the rotated value would require predicting the new external-name ref ahead of time; end-to-end coverage of the shared external-name-refresh-persistence fix lives on record-srv.yaml's priority field instead"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    name: txt-${data.runToken}.example.com
    text: "v=spf1 -all"
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
