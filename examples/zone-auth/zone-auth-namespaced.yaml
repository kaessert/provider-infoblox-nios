# ZoneAuth is the namespace-scoped variant of the Infoblox NIOS
# authoritative DNS zone. See zone-auth.yaml for the cluster-scoped variant
# and full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the fqdn below differs from zone-auth.yaml's so both
# examples can be applied to the same NIOS Grid Manager at once without
# colliding on the same (view, fqdn) WAPI identity. Like zone-auth.yaml, it
# is deliberately not a child of "example.com" — test/setup.sh
# pre-provisions that zone out-of-band as a parent-zone prerequisite for
# the DNS record examples.
#
# ${data.runToken}: see zone-auth.yaml — same per-run isolation token,
# applied here too so this scope's identity ALSO differs across
# concurrent E2E runs, not just from its cluster-scoped sibling.
#
# gridPrimary + useGridZoneTimer: see zone-auth.yaml for why both are
# required for the soa_* fields to round-trip through WAPI at all.
apiVersion: zoneauth.infobloxnios.m.crossplane.io/v1alpha1
kind: ZoneAuth
metadata:
  name: example-zoneauth-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: zoneauth/v1alpha1/zoneauth
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # zone-auth.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-zone-auth-namespaced.sh
    # See zone-auth.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: disable
        value: true
      - field: soaDefaultTtl
        value: 7200
      - field: soaExpire
        value: 1209600
      - field: soaNegativeTtl
        value: 300
      - field: soaRefresh
        value: 21600
      - field: soaRetry
        value: 7200
      - field: useGridZoneTimer
        skip: "set once at create time to enable the SOA timer overrides above; toggling it mid-run would revert the zone to Grid-inherited timers and destabilize the soa_* tests running in the same pass"
      - field: nsGroup
        skip: "no NsGroup object pre-provisioned on this E2E Grid Manager"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: gridPrimary
        skip: "now set at create time (see spec.forProvider.gridPrimary) so WAPI returns the soa_*/useGridZoneTimer fields under test above; collection field describing Grid topology, not exercised via per-field diff testing"
      - field: gridSecondaries
        skip: "collection field — this E2E Grid Manager has only one member, so no secondary is available"
      - field: externalPrimaries
        skip: "collection field describing external DNS server topology; not exercised via per-field diff testing"
      - field: externalSecondaries
        skip: "collection field describing external DNS server topology; not exercised via per-field diff testing"
spec:
  forProvider:
    fqdn: example-ns-${data.runToken}.com
    view: default
    comment: Managed by Crossplane (namespaced)
    useGridZoneTimer: true
    soaDefaultTtl: 3600
    soaExpire: 2419200
    soaNegativeTtl: 900
    soaRefresh: 10800
    soaRetry: 3600
    gridPrimary:
      - name: infoblox.localdomain
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
