# ZoneAuth is the namespace-scoped variant of the Infoblox NIOS
# authoritative DNS zone. See zone-auth.yaml for the cluster-scoped variant
# and full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the fqdn below differs from zone-auth.yaml's so both
# examples can be applied to the same NIOS Grid Manager at once without
# colliding on the same (view, fqdn) WAPI identity.
apiVersion: zoneauth.infobloxnios.m.crossplane.io/v1alpha1
kind: ZoneAuth
metadata:
  name: example-zoneauth-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: zoneauth/v1alpha1/zoneauth
    uptest.upbound.io/timeout: "120"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # zone-auth.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-zone-auth-namespaced.sh
    # See zone-auth.yaml for the field coverage rationale.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
      - field: disable
        value: true
      - field: soaDefaultTtl
        value: 3600
      - field: soaExpire
        value: 2419200
      - field: soaNegativeTtl
        value: 900
      - field: soaRefresh
        value: 10800
      - field: soaRetry
        value: 3600
      - field: nsGroup
        skip: "references a pre-existing Grid delegation name server group not created by this standalone example"
      - field: gridPrimary
        skip: "requires real Grid member names and a structural primary/secondary type change, not modeled by this example"
      - field: gridSecondaries
        skip: "requires real Grid member names and a structural primary/secondary type change, not modeled by this example"
      - field: externalPrimaries
        skip: "requires real external-server names/addresses and a structural primary/secondary type change, not modeled by this example"
      - field: externalSecondaries
        skip: "requires real external-server names/addresses and a structural primary/secondary type change, not modeled by this example"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    fqdn: example-ns.com
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
