# ZoneAuth is a cluster-scoped Infoblox NIOS authoritative DNS zone (WAPI
# object type zone_auth). See zone-auth-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "zone_auth/ZG5zLnpvbmUk...:zoneauth-example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Create behavior: sync — the WAPI POST returns the new object's `_ref`
# immediately (HTTP 201), so the default uptest timeout is sufficient.
#
# Distinct identity: fqdn uses "zoneauth-example.com", NOT "example.com" —
# the shared E2E setup script (test/setup.sh) pre-provisions a zone_auth
# object for "example.com" in the default view out-of-band (as a WAPI
# parent-zone prerequisite for the DNS record examples), so a ZoneAuth CR
# also targeting "example.com"/default would collide with that
# pre-existing object on Create (IB.Data.Conflict).
#
# Required fields:
#   fqdn: fully-qualified domain name of the zone, e.g. "zoneauth-example.com".
#         Immutable after creation (CEL rule enforced) — WAPI rejects a PUT
#         that changes it with "Field is not allowed for update".
#
# Optional immutable fields: view, zoneFormat (both fixed at creation —
# WAPI rejects a PUT that changes either: view with "Cannot move zones
# between views", zoneFormat with "Field is not allowed for update").
#
# Optional mutable fields: comment, disable, soaDefaultTtl, soaExpire,
# soaNegativeTtl, soaRefresh, soaRetry, useGridZoneTimer, nsGroup, extAttrs,
# gridPrimary, gridSecondaries, externalPrimaries, externalSecondaries. WAPI
# supports PUT for these fields, so the zone is updated in place rather than
# replaced.
#
# gridPrimary + useGridZoneTimer: the appliance only returns
# soaDefaultTtl/soaExpire/soaNegativeTtl/soaRefresh/soaRetry/
# useGridZoneTimer for a zone that has at least one grid primary — a zone
# with an empty gridPrimary list omits all six fields from every WAPI GET
# response, even when they are explicitly requested via _return_fields, and
# a PUT that sets them is silently accepted but never reflected back. This
# example therefore sets a real Grid member as gridPrimary and enables
# useGridZoneTimer so the SOA fields round-trip and status.atProvider
# mirrors them. "infoblox.localdomain" is this E2E Grid Manager's only
# member — if a different Grid is ever used, update test/setup.sh to
# resolve the member name dynamically (e.g. from a WAPI GET against the
# member object) instead of hardcoding it here.
#
# uptest.upbound.io/update-parameter is intentionally omitted — it has
# known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
# comment field below is a safe mutable scalar for update coverage;
# field-level update testing is wired via the hook annotation below.
apiVersion: zoneauth.infobloxnios.crossplane.io/v1alpha1
kind: ZoneAuth
metadata:
  name: example-zoneauth
  annotations:
    meta.upbound.io/example-id: zoneauth/v1alpha1/zoneauth
    uptest.upbound.io/timeout: "120"
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-zone-auth.sh
    # comment, disable, and the SOA scalars (soaDefaultTtl, soaExpire,
    # soaNegativeTtl, soaRefresh, soaRetry) are the mutable scalars
    # exercised here — WAPI supports PUT for all of them, updating the
    # zone in place. nsGroup references a pre-existing Grid delegation
    # name server group not created by this standalone example.
    # gridPrimary/gridSecondaries/externalPrimaries/externalSecondaries
    # require real Grid member or external-server names/addresses and
    # switching between them is a structural primary/secondary type
    # change, not modeled by this example (which relies on the WAPI
    # default primary-on-Grid-Master behavior). extAttrs is an optional
    # map field skipped for low update-test value.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: disable
        value: true
      - field: soaDefaultTtl
        value: 7200
      - field: soaExpire
        value: 1209600
      - field: soaNegativeTtl
        value: 300
      - field: soaRefresh
        value: 21600
      - field: soaRetry
        value: 7200
      - field: useGridZoneTimer
        skip: "set once at create time to enable the SOA timer overrides above; toggling it mid-run would revert the zone to Grid-inherited timers and destabilize the soa_* tests running in the same pass"
      - field: nsGroup
        skip: "no NsGroup object pre-provisioned on this E2E Grid Manager"
      - field: extAttrs
        skip: "map field — not a scalar update target"
      - field: gridPrimary
        skip: "now set at create time (see spec.forProvider.gridPrimary) so WAPI returns the soa_*/useGridZoneTimer fields under test above; collection field describing Grid topology, not exercised via per-field diff testing"
      - field: gridSecondaries
        skip: "collection field — this E2E Grid Manager has only one member, so no secondary is available"
      - field: externalPrimaries
        skip: "collection field describing external DNS server topology; not exercised via per-field diff testing"
      - field: externalSecondaries
        skip: "collection field describing external DNS server topology; not exercised via per-field diff testing"
spec:
  forProvider:
    fqdn: zoneauth-example.com
    view: default
    comment: Managed by Crossplane
    useGridZoneTimer: true
    soaDefaultTtl: 3600
    soaExpire: 2419200
    soaNegativeTtl: 900
    soaRefresh: 10800
    soaRetry: 3600
    gridPrimary:
      - name: infoblox.localdomain
  providerConfigRef:
    name: default
