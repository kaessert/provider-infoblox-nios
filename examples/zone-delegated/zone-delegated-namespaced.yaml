# ZoneDelegated is the namespace-scoped variant of the Infoblox NIOS
# delegated DNS zone. See zone-delegated.yaml for the cluster-scoped variant
# and full field documentation — this file only documents what differs.
#
# This example references the cluster-scoped ClusterProviderConfig (usable
# by namespaced resources from any namespace) rather than the
# namespace-scoped ProviderConfig — see examples/provider/config.yaml for
# both options.
#
# Distinct identity: the fqdn below differs from zone-delegated.yaml's so
# both examples can be applied to the same NIOS Grid Manager at once
# without colliding on the same (view, fqdn) WAPI identity.
apiVersion: zonedelegated.infobloxnios.m.crossplane.io/v1alpha1
kind: ZoneDelegated
metadata:
  name: example-zonedelegated-ns
  namespace: default
  annotations:
    meta.upbound.io/example-id: zonedelegated/v1alpha1/zonedelegated
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — see
    # zone-delegated.yaml for the rationale.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-zone-delegated-namespaced.sh
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester (namespaced)"
spec:
  forProvider:
    fqdn: delegated-ns.example.com
    delegateTo:
      - name: ns1.delegate.com
        address: 10.0.1.1
      - name: ns2.delegate.com
        address: 10.0.1.2
    view: default
    comment: Managed by Crossplane (namespaced)
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
