# ZoneForward is a cluster-scoped Infoblox NIOS forward DNS zone (WAPI
# object type zone_forward). See zone-forward-namespaced.yaml for the
# namespace-scoped variant used by namespaced (ModernManaged) resources.
#
# External name: server-assigned. WAPI returns an opaque `_ref` string
# (e.g. "zone_forward/ZG5zLnpvbmUk...:forward.example.com/default") from
# Create; Crossplane stores it in the crossplane.io/external-name
# annotation. Do not set that annotation manually — the controller
# populates it.
#
# Required fields:
#   fqdn:      FQDN of the forward zone. Immutable after creation (CEL
#              rule enforced) — the UpdateZoneForward SDK call has no
#              fqdn parameter.
#   forwardTo: list of remote name servers the appliance forwards queries
#              for this zone to (name + address pairs).
#
# Optional immutable fields: view, zoneFormat (both fixed at creation —
# absent from the UpdateZoneForward SDK call; view is additionally
# rejected by WAPI at the data level if changed).
#
# Optional mutable fields: comment, disable, forwardersOnly, nsGroup,
# externalNsGroup, forwardingServers, extAttrs.
apiVersion: zoneforward.infobloxnios.crossplane.io/v1alpha1
kind: ZoneForward
metadata:
  name: example-zoneforward
  annotations:
    meta.upbound.io/example-id: zoneforward/v1alpha1/zoneforward
    uptest.upbound.io/timeout: "300"
    # uptest.upbound.io/update-parameter is intentionally omitted — it has
    # known bugs in uptest v2.2.0 (shell-quoting breaks JSON values). The
    # comment field below is a safe mutable scalar for update coverage;
    # field-level update testing is wired via the hook annotation below.
    uptest.upbound.io/post-assert-hook: ../../test/hooks/post-assert-zone-forward.sh
    # comment, disable, and forwardersOnly are the mutable scalars
    # exercised here. forwardTo/forwardingServers are list fields and
    # extAttrs is a map field, none are safe scalar update-test targets.
    # nsGroup/externalNsGroup reference a pre-existing Grid stub-server
    # name server group not created by this standalone example.
    crossplane.io/update-test: |
      - field: comment
        value: "Updated by update-tester"
      - field: disable
        value: true
      - field: forwardersOnly
        value: true
      - field: forwardTo
        skip: "list field, not a scalar update-test target"
      - field: forwardingServers
        skip: "list field of per-Grid-member forwarding overrides, not a scalar update-test target"
      - field: nsGroup
        skip: "references a pre-existing Grid stub-server name server group not created by this standalone example"
      - field: externalNsGroup
        skip: "references a pre-existing Grid stub-server name server group not created by this standalone example"
      - field: extAttrs
        skip: "optional map field, low update-test value"
spec:
  forProvider:
    fqdn: forward.example.com
    forwardTo:
      - name: ns1.forwarder.com
        address: 10.0.0.1
      - name: ns2.forwarder.com
        address: 10.0.0.2
    view: default
    comment: Managed by Crossplane
  providerConfigRef:
    name: default
