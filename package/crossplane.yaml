apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-infobloxnios
  annotations:
    meta.crossplane.io/maintainer: Crossplane Maintainers <info@crossplane.io>
    meta.crossplane.io/source: github.com/crossplane-contrib/provider-infoblox-nios
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      `provider-infobloxnios` is a Crossplane Provider for Infoblox NIOS
    meta.crossplane.io/readme: |
      `provider-infobloxnios` is a Crossplane Provider for managing
      Infoblox NIOS DDI (DNS, DHCP, IPAM) resources.

      Before installing, create the `Crossplane Internal ID` extensible
      attribute definition on your Grid (or use a superuser credential so
      the provider can create it itself) — see the Prerequisites section of
      the provider's README for details and the exact WAPI call.
    friendly-name.meta.crossplane.io: Provider Infoblox NIOS
spec:
  capabilities:
    - SafeStart
